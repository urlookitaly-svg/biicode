<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1320">
<title>BIICODE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b1320;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}main{max-width:520px;margin:auto;padding:20px 20px 100px;min-height:100vh}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.card{background:#111d2d;border:1px solid #203149;border-radius:20px;padding:20px}.login .box{width:100%;max-width:410px}.logo{text-align:center;font-size:38px;font-weight:950;margin-bottom:6px}.logo b{color:#1565ff}.tag{text-align:center;color:#94a1b3;font-size:10px;letter-spacing:1.4px;margin-bottom:25px}.title{font-size:25px;font-weight:900;margin-bottom:6px}.muted{color:#94a1b3;font-size:13px}label{display:block;margin:16px 0 7px;color:#aab5c4;font-size:13px;font-weight:700}input{width:100%;min-height:54px;padding:13px 14px;background:#0b1625;border:1px solid #2a3b52;border-radius:13px;color:#fff;outline:0}input:focus{border-color:#1565ff}.btn{width:100%;min-height:54px;border:0;border-radius:13px;font-weight:900;margin-top:12px;background:#1565ff;color:#fff}.btn:disabled{opacity:.55}.secondary{background:#111d2d;border:1px solid #2a3b52}.link{display:block;width:100%;background:none;border:0;color:#5790ff;font-weight:800;margin-top:14px}.msg{padding:12px;border-radius:12px;margin-bottom:14px;font-size:13px}.error{background:#29151b;color:#ffb4bc}.ok{background:#10271c;color:#a9efc4}.head{display:flex;align-items:center;gap:12px;margin-bottom:25px}.mini{width:46px;height:46px;border-radius:14px;background:#07101d;display:grid;place-items:center;font-size:23px;font-weight:950}.mini b{color:#1565ff}.brand{font-size:20px;font-weight:900}.statusbar{font-size:11px;color:#94a1b3;margin-bottom:15px}.bike{display:flex;justify-content:space-between;align-items:center;gap:12px}.id{font-size:12px;color:#94a1b3}.pill{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:9px;font-size:10px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.action{min-height:110px;background:#111d2d;border:1px solid #203149;border-radius:16px;color:#fff;text-align:left;padding:15px}.action strong{display:block;margin-bottom:7px}.nav{position:fixed;left:0;right:0;bottom:0;height:75px;background:#0e1a2a;border-top:1px solid #203149;display:flex;justify-content:center;gap:8px;z-index:10}.nav button{flex:1;max-width:105px;border:0;background:none;color:#94a1b3;font-weight:800}.nav .active{color:#fff}.plus{color:#fff!important;background:#1565ff!important;border-radius:50%!important;max-width:58px!important;height:58px;margin-top:-10px}.modal{position:fixed;inset:0;background:#0b1320;z-index:20;overflow:auto;padding:20px;display:none}.modal.open{display:block}.modalin{max-width:520px;margin:auto}.back{border:0;background:none;color:#5790ff;font-weight:900;padding:8px 0 20px}.danger{background:#ef4444}.small{font-size:11px;color:#7f8b9a}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #94a1b3;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style></head>
<body>
<main id="main"></main><div id="nav" class="nav hidden"></div><div id="modal" class="modal"><div id="modalin" class="modalin"></div></div>
<script>
/* BIICODE v3: niente SDK/CDN obbligatorio. L'app parte subito e parla a Supabase via REST. */
const SUPABASE_URL='https://swzkrwdqfgetwcmaiqty.supabase.co';
const SUPABASE_KEY='sb_publishable_inpwNp-Uqe-X4BeTl54uiQ_1ARA1HNb';
const main=document.getElementById('main'),nav=document.getElementById('nav'),modal=document.getElementById('modal'),mi=document.getElementById('modalin');
let user=null,bikes=[],session=null,syncing=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const key=()=>`biicode_v3_${user?.id||'guest'}`;
const authHeaders=token=>({apikey:SUPABASE_KEY,Authorization:`Bearer ${token||SUPABASE_KEY}`,'Content-Type':'application/json'});
async function api(path,opts={}){const r=await fetch(SUPABASE_URL+path,{...opts,headers:{...authHeaders(session?.access_token),...(opts.headers||{})}});let data=null;try{data=await r.json()}catch{}if(!r.ok){const e=new Error(data?.msg||data?.message||data?.error_description||data?.error||`HTTP ${r.status}`);e.status=r.status;throw e}return data}
function localLoad(){try{bikes=JSON.parse(localStorage.getItem(key())||'[]');if(!Array.isArray(bikes))bikes=[]}catch{bikes=[]}}
function localSave(){if(user)localStorage.setItem(key(),JSON.stringify(bikes))}
function msg(t,type='error'){const e=document.getElementById('msg');if(e){e.textContent=t;e.className='msg '+type;e.classList.remove('hidden')}}
function login(){nav.classList.add('hidden');main.innerHTML=`<div class="login"><div class="box"><div class="logo">b<b>◯</b></div><div class="tag">LA TUA BICI. UN'IDENTITÀ UNICA.</div><div id="msg" class="msg hidden"></div><div class="title">Accedi</div><div class="muted">Accesso diretto a BIICODE. L'app resta visibile anche se Supabase non risponde.</div><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="pass" type="password" autocomplete="current-password"><button class="btn" id="go" onclick="doLogin()">ACCEDI</button><button class="link" onclick="register()">CREA UN ACCOUNT</button><button class="link" onclick="forgot()">PASSWORD DIMENTICATA?</button></div></div>`}
async function doLogin(){const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value,b=document.getElementById('go');if(!email||!password)return msg('Inserisci email e password.');b.disabled=true;b.innerHTML='<span class="spinner"></span> ACCESSO...';try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});await setSession(d);await enter()}catch(e){msg(e.message==='Invalid login credentials'?'Email o password non corrette.':e.message||'Accesso non riuscito.');b.disabled=false;b.textContent='ACCEDI'}}
async function register(){main.innerHTML=`<div class="login"><div class="box"><div class="logo">b<b>◯</b></div><div class="tag">CREA ACCOUNT BIICODE</div><div id="msg" class="msg hidden"></div><div class="title">Registrati</div><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="pass" type="password" autocomplete="new-password"><button class="btn" onclick="doRegister()">CREA ACCOUNT</button><button class="link" onclick="login()">← Torna al login</button></div></div>`}
async function doRegister(){const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(!email||password.length<6)return msg('Inserisci un email valida e una password di almeno 6 caratteri.');try{const d=await api('/auth/v1/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(!d.access_token){msg('Account creato. Controlla la tua email per confermare l’account.','ok');return}await setSession(d);await enter()}catch(e){msg(e.message||'Registrazione non riuscita.')}}
async function forgot(){main.innerHTML=`<div class="login"><div class="box"><div class="logo">b<b>◯</b></div><div class="tag">RECUPERO PASSWORD</div><div id="msg" class="msg hidden"></div><div class="title">Password dimenticata</div><label>Email</label><input id="email" type="email" autocomplete="email"><button class="btn" onclick="sendRecovery()">INVIA EMAIL</button><button class="link" onclick="login()">← Torna al login</button></div></div>`}
async function sendRecovery(){const email=document.getElementById('email').value.trim();if(!email)return msg('Inserisci la tua email.');try{await api('/auth/v1/recover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});msg('Se l’email è registrata, riceverai le istruzioni per reimpostare la password.','ok')}catch(e){msg(e.message||'Impossibile inviare il recupero.')}}
async function setSession(d){session={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};user=d.user;localStorage.setItem('biicode_session',JSON.stringify(session));localLoad()}
async function restoreSession(){try{const raw=localStorage.getItem('biicode_session');if(!raw)return false;session=JSON.parse(raw);if(!session?.refresh_token)return false;try{const d=await api('/auth/v1/user');user=d;localLoad();return true}catch{const d=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});await setSession(d);return true}}catch{localStorage.removeItem('biicode_session');session=null;user=null;return false}}
async function enter(){await syncFromServer();renderHome()}
async function syncFromServer(){if(!user||!session?.access_token||syncing)return;syncing=true;setStatus('Sincronizzazione...');try{const d=await api(`/rest/v1/bikes?select=*&user_id=eq.${encodeURIComponent(user.id)}&order=created_at.desc`);bikes=(d||[]).map(normalize);localSave();setStatus('Online · dati sincronizzati')}catch(e){setStatus('Offline · modalità locale')}finally{syncing=false}}
function normalize(b){return{biicode_id:b.biicode_id||b.id||'',brand:b.brand||'',model:b.model||'',year:b.year||'',color:b.color||'',frame_number:b.frame_number||'',stolen:b.stolen===true,photos:Array.isArray(b.photos)?b.photos:[],user_id:b.user_id,status:b.status||'active'}}
function setStatus(t){const e=document.getElementById('status');if(e)e.textContent=t}
function shell(active){nav.classList.remove('hidden');nav.innerHTML=`<button class="${active==='home'?'active':''}" onclick="renderHome()">⌂<br>Home</button><button class="${active==='bikes'?'active':''}" onclick="renderBikes()">🚲<br>Bici</button><button class="plus" onclick="addBike()">+</button><button class="${active==='profile'?'active':''}" onclick="profile()">○<br>Profilo</button>`}
function renderHome(){shell('home');main.innerHTML=`<div class="head"><div class="mini">b<b>◯</b></div><div><div class="brand">BIICODE</div><div class="tag" style="text-align:left;margin:2px 0 0">LA TUA BICI. UN'IDENTITÀ UNICA.</div></div></div><div id="status" class="statusbar">${syncing?'Sincronizzazione...':'Pronto'}</div><h1>Le mie bici</h1>${bikes.length?bikes.map(card).join(''):`<div class="card"><strong>Nessuna bici registrata</strong><div class="muted">Registra la tua prima bici.</div></div>`}<div class="grid"><button class="action" onclick="addBike()"><strong>＋ Immatricola</strong><span class="muted">Registra una bici</span></button><button class="action" onclick="syncFromServer()"><strong>↻ Sincronizza</strong><span class="muted">Aggiorna i dati</span></button></div>`}
function card(b){return `<div class="card bike" onclick="detail('${encodeURIComponent(b.biicode_id)}')"><div><strong>${esc(b.brand)} ${esc(b.model)}</strong><div class="id">${esc(b.biicode_id)}</div><span class="pill" style="background:${b.stolen?'#ef4444':'#22c55e'}">${b.stolen?'RUBATA':'ATTIVA'}</span></div><div>›</div></div>`}
function renderBikes(){shell('bikes');main.innerHTML='<h1>Le mie bici</h1>'+(bikes.length?bikes.map(card).join(''):'<div class="card">Nessuna bici registrata.</div>')+'<button class="btn" onclick="addBike()">＋ IMMATRICOLA BICI</button>'}
function profile(){shell('profile');main.innerHTML=`<h1>Profilo</h1><div class="card"><strong>${esc(user?.email||'')}</strong><div class="muted">Account BIICODE</div><br><div class="muted">${bikes.length} bici registrate</div></div><button class="btn secondary" onclick="syncFromServer()">SINCRONIZZA DATI</button><button class="btn secondary" onclick="logout()">ESCI</button>`}
function openModal(html){mi.innerHTML=html;modal.classList.add('open')}
function closeModal(){modal.classList.remove('open');mi.innerHTML='';renderHome()}
function addBike(){openModal(`<button type="button" class="back" onclick="closeModal()">‹ Annulla</button><h1>Immatricola bici</h1><label>Marca</label><input id="brand"><label>Modello</label><input id="model"><label>Anno</label><input id="year" type="number"><label>Colore</label><input id="color"><label>Numero telaio</label><input id="frame"><button class="btn" onclick="saveBike()">SALVA BICI</button><div class="small" style="margin-top:15px">Se Supabase non risponde, la bici viene salvata localmente.</div>`)}
function makeId(){let s='IT-',c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
async function saveBike(){const brand=document.getElementById('brand').value.trim(),model=document.getElementById('model').value.trim(),frame=document.getElementById('frame').value.trim();if(!brand||!model||!frame)return alert('Marca, modello e numero telaio sono obbligatori.');const b={biicode_id:makeId(),user_id:user.id,brand,model,year:document.getElementById('year').value,color:document.getElementById('color').value,frame_number:frame,stolen:false,status:'active',photos:[]};bikes.unshift(b);localSave();try{await api('/rest/v1/bikes',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(b)});setStatus('Online · bici sincronizzata')}catch(e){setStatus('Offline · bici salvata localmente')}closeModal();renderHome()}
function detail(enc){const b=bikes.find(x=>x.biicode_id===decodeURIComponent(enc));if(!b)return;openModal(`<button type="button" class="back" onclick="closeModal()">‹ Indietro</button><h1>${esc(b.brand)} ${esc(b.model)}</h1><div class="card"><div class="muted">BIICODE</div><h2>${esc(b.biicode_id)}</h2><div class="muted">Telaio</div><strong>${esc(b.frame_number)}</strong><br><br><div class="muted">${esc(b.year||'-')} · ${esc(b.color||'-')}</div><div class="msg ${b.stolen?'error':'ok'}" style="margin-top:18px">${b.stolen?'🔴 QUESTA BICI RISULTA RUBATA':'🟢 QUESTA BICI RISULTA ATTIVA'}</div><button class="btn ${b.stolen?'':'danger'}" onclick="toggle('${encodeURIComponent(b.biicode_id)}')">${b.stolen?'SEGNALA RECUPERO':'SEGNALA FURTO'}</button><button class="btn secondary" onclick="deleteBike('${encodeURIComponent(b.biicode_id)}')">ELIMINA BICI</button></div>`)}
async function toggle(enc){const b=bikes.find(x=>x.biicode_id===decodeURIComponent(enc));if(!b)return;b.stolen=!b.stolen;b.status=b.stolen?'stolen':'active';localSave();try{await api(`/rest/v1/bikes?biicode_id=eq.${encodeURIComponent(b.biicode_id)}&user_id=eq.${encodeURIComponent(user.id)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({stolen:b.stolen,status:b.status})})}catch{}detail(enc)}
async function deleteBike(enc){const b=bikes.find(x=>x.biicode_id===decodeURIComponent(enc));if(!b||!confirm('Eliminare definitivamente questa bici?'))return;bikes=bikes.filter(x=>x.biicode_id!==b.biicode_id);localSave();try{await api(`/rest/v1/bikes?biicode_id=eq.${encodeURIComponent(b.biicode_id)}&user_id=eq.${encodeURIComponent(user.id)}`,{method:'DELETE',headers:{Prefer:'return=minimal'}})}catch{}closeModal();renderHome()}
async function logout(){try{if(session?.access_token)await api('/auth/v1/logout',{method:'POST'})}catch{}localStorage.removeItem('biicode_session');session=null;user=null;bikes=[];nav.classList.add('hidden');login()}
/* Bootstrap non dipende da Supabase JS: la UI viene renderizzata subito. */
(async()=>{login();const ok=await restoreSession();if(ok)await enter()})();
</script></body></html>
