<!doctype html>
<html lang="it">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#0B1320"
>

<title>BIICODE</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  margin:0;
  padding:0;
  background:#0B1320;
}

body{
  margin:0;
  padding:0;

  min-height:100vh;
  min-height:100dvh;

  background:#0B1320;
  color:#FFFFFF;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input{
  font:inherit;
}


/* =========================================================
   APP PRINCIPALE
========================================================= */

main{
  width:100%;
  max-width:480px;
  margin:0 auto;

  padding:
    20px
    20px
    calc(110px + env(safe-area-inset-bottom));

  min-height:100vh;
  min-height:100dvh;
}


/* =========================================================
   HEADER
========================================================= */

.head{
  display:flex;
  align-items:center;
  gap:12px;

  margin-bottom:30px;
}

.logo{
  width:48px;
  height:48px;

  flex:none;

  border-radius:12px;

  background:#07101D;

  display:grid;
  place-items:center;

  font-size:25px;
  font-weight:900;
}

.logo b{
  color:#1565FF;
}

.brand{
  font-size:21px;
  font-weight:900;
}

.tag{
  margin-top:2px;

  font-size:8px;

  color:#9AA7B8;

  letter-spacing:1px;
}


/* =========================================================
   TESTI
========================================================= */

h1{
  margin:10px 0 18px;

  font-size:28px;
  line-height:1.15;

  font-weight:900;
}

.muted{
  color:#94A1B3;
  font-size:13px;
}

.small{
  font-size:11px;
}


/* =========================================================
   CARD
========================================================= */

.card{
  background:#111D2D;

  border:1px solid #203149;

  border-radius:18px;

  padding:16px;

  margin-bottom:14px;
}

.bike{
  display:flex;
  gap:15px;
  align-items:center;

  cursor:pointer;
}

.pic{
  width:90px;
  height:80px;

  flex:none;

  background:#0A1523;

  border-radius:14px;

  display:grid;
  place-items:center;

  font-size:42px;
}

.name{
  font-size:17px;
  font-weight:800;
  word-break:break-word;
}

.id{
  margin-top:5px;

  font-size:12px;

  color:#94A1B3;
}

.status{
  display:inline-block;

  padding:4px 9px;

  border-radius:10px;

  margin-top:7px;

  font-size:10px;
  font-weight:800;

  color:#FFFFFF;
}


/* =========================================================
   GRIGLIA HOME
========================================================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.action{
  width:100%;

  min-height:110px;

  padding:18px;

  background:#111D2D;
  color:#FFFFFF;

  border:1px solid #203149;

  border-radius:16px;

  text-align:left;

  font-size:14px;

  cursor:pointer;
}

.action:active{
  transform:scale(.98);
}

.ico{
  display:block;

  margin-bottom:12px;

  font-size:27px;

  color:#1565FF;
}


/* =========================================================
   BUTTON
========================================================= */

button{
  cursor:pointer;

  -webkit-appearance:none;
  appearance:none;
}

.primary{
  display:block;

  width:100%;

  min-height:58px;

  padding:16px;

  border:0;

  border-radius:14px;

  background:#1565FF;

  color:#FFFFFF;

  font-size:16px;
  font-weight:900;

  text-align:center;

  cursor:pointer;

  box-shadow:
    0 6px 20px rgba(21,101,255,.20);
}

.primary:active{
  transform:scale(.98);
}

.primary:disabled{
  opacity:.6;
  cursor:not-allowed;
}


/* =========================================================
   INPUT
========================================================= */

label{
  display:block;

  margin-top:4px;

  font-size:13px;
  font-weight:600;

  color:#AAB5C4;
}

input{
  display:block;

  width:100%;

  min-height:58px;

  padding:15px;

  margin:
    7px
    0
    20px;

  background:#111D2D;

  border:1px solid #2A3B52;

  border-radius:14px;

  color:#FFFFFF;

  font-size:17px;

  outline:none;

  -webkit-appearance:none;
  appearance:none;
}

input::placeholder{
  color:#7F8B9A;
}

input:focus{
  border-color:#1565FF;

  box-shadow:
    0 0 0 2px rgba(21,101,255,.20);
}


/* =========================================================
   NAVIGAZIONE
========================================================= */

.nav{
  position:fixed;

  z-index:100;

  left:0;
  right:0;
  bottom:0;

  height:
    calc(82px + env(safe-area-inset-bottom));

  padding-bottom:
    env(safe-area-inset-bottom);

  background:#0E1A2A;

  border-top:1px solid #203149;

  display:flex;

  justify-content:space-around;

  align-items:center;
}

.nav button{
  width:20%;

  height:65px;

  padding:0;

  background:none;

  border:0;

  color:#9AA4B2;

  font-size:12px;
  font-weight:600;

  text-align:center;
}

.nav button:active{
  color:#FFFFFF;
}

.plus{
  width:58px!important;
  height:58px!important;

  flex:none;

  margin-top:-28px;

  border-radius:50%!important;

  background:#1565FF!important;

  color:#FFFFFF!important;

  font-size:32px!important;
  font-weight:400!important;

  box-shadow:
    0 8px 25px rgba(21,101,255,.30);
}


/* =========================================================
   MODULO
========================================================= */

body.form-open .nav{
  display:none;
}

body.form-open main{
  display:none;
}

.modal{
  position:fixed;

  z-index:500;

  inset:0;

  width:100%;
  height:100%;
  height:100dvh;

  background:#0B1320;

  overflow-y:auto;
  overflow-x:hidden;

  -webkit-overflow-scrolling:touch;

  overscroll-behavior:contain;

  padding:
    calc(20px + env(safe-area-inset-top))
    20px
    calc(50px + env(safe-area-inset-bottom));

  display:none;
}

.modal.active{
  display:block;
}

.modal-content{
  width:100%;

  max-width:480px;

  margin:0 auto;

  padding-bottom:40px;
}


/* =========================================================
   BACK
========================================================= */

.back{
  display:block;

  padding:8px 0 20px;

  background:none;

  border:0;

  color:#1565FF;

  font-size:18px;
  font-weight:800;

  text-align:left;
}


/* =========================================================
   FORM
========================================================= */

.form-actions{
  width:100%;

  margin-top:10px;

  padding-top:5px;

  padding-bottom:30px;
}


/* =========================================================
   QR
========================================================= */

.qr{
  width:max-content;

  max-width:100%;

  margin:
    20px
    auto;

  padding:12px;

  background:#FFFFFF;

  border-radius:12px;
}

.qr img{
  display:block;
}


/* =========================================================
   ALERT
========================================================= */

.alert{
  padding:14px;

  margin:15px 0;

  border-radius:12px;

  background:#10271C;

  color:#A9EFC4;

  font-size:14px;
  font-weight:700;
}

.stolen{
  background:#29151B;

  color:#FFB4BC;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
  padding:25px 10px;

  color:#94A1B3;

  text-align:center;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

  main{
    padding-left:15px;
    padding-right:15px;
  }

  .modal{
    padding-left:15px;
    padding-right:15px;
  }

  h1{
    font-size:26px;
  }

  .grid{
    gap:8px;
  }

  .action{
    padding:15px;
  }

}


/* =========================================================
   PREVENZIONE OVERFLOW
========================================================= */

img,
svg,
canvas{
  max-width:100%;
}

</style>

</head>


<body>


<!-- =======================================================
     APP
======================================================== -->

<main>

  <div class="head">

    <div class="logo">
      b<b>◯</b>
    </div>

    <div>

      <div class="brand">
        BIICODE
      </div>

        LA TUA BICI. UN'IDENTITÀ UNICA.
      </div>

    </div>

  </div>

  <div id="app"></div>

</main>


<!-- =======================================================
     NAVIGAZIONE

<div

  class="nav"
>

  <button
    type="button"

  >
    ⌂
    <br>
    Home
  </button>


  <button

    onclick="bikes()"
  >
    🚲
    <br>
    Bici
  </button>


  <button
    type="button"
    class="plus"
    onclick="add()"
  >
    +
  </button>


  <button
    type="button"
    onclick="activity()"
  >
    ▤
    <br>
    Attività
  </button>


  <button
    type="button"
    onclick="profile()"
  >
    ○
    <br>
    Profilo
  </button>

</div>


<!-- =======================================================
     MODULO
======================================================== -->

<div
  id="modal"
  class="modal"
></div>


<!-- =======================================================
     LIBRERIE
========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   CONFIGURAZIONE SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://swzkrwdqfgetwcmaiqty.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_inpwNp-Uqe-X4BeTl54uiQ_1ARA1HNb";


const {
  createClient
} = supabase;


const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   ELEMENTI
========================================================= */

const app =
  document.getElementById("app");


const modal =
  document.getElementById("modal");


const navigation =
  document.getElementById("navigation");


/* =========================================================
   DATI
========================================================= */

let data = [];


/* =========================================================
   SALVATAGGIO LOCALE BACKUP
========================================================= */

function saveLocal(){

  localStorage.setItem(
    "biicode",
    JSON.stringify(data)
  );

}


function loadLocal(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem("biicode") || "[]"
      );


    if(
      Array.isArray(saved)
    ){

      return saved;

    }

  }catch(error){

    console.warn(
      "Errore lettura dati locali:",
      error
    );

  }


  return [];

}


/* =========================================================
   GENERA BIICODE
========================================================= */

function generateId(){

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


  let result = "IT-";


  for(
    let i = 0;
    i < 8;
    i++
  ){

    result +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }


  return result;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   TROVA BICI
========================================================= */

function findBike(idValue){

  return data.find(
    bike => bike.id === idValue
  );

}


/* =========================================================
   CARD BICI
========================================================= */

function card(b){

  const stolen =
    b.stolen === true;


  return `

    <div
      class="card bike"
      onclick="detail('${escapeHTML(b.id)}')"
    >

      <div class="pic">
        🚲
      </div>


      <div>

        <div class="name">

          ${escapeHTML(b.brand)}
          ${escapeHTML(b.model)}

        </div>


        <div class="id">

          ${escapeHTML(b.id)}

        </div>


        <span
          class="status"
          style="
            background:
            ${
              stolen
              ? "#EF4444"
              : "#22C55E"
            };
          "
        >

          ${
            stolen
            ? "RUBATA"
            : "ATTIVA"
          }

        </span>

      </div>

    </div>

  `;

}


/* =========================================================
   HOME
========================================================= */

function home(){

  closeM();


  navigation.style.display =
    "flex";


  app.innerHTML = `

    <div class="muted">
      BIICODE
    </div>


    <h1>
      Le mie bici
    </h1>


    ${
      data.length
      ? data.map(card).join("")
      : `

        <div class="card">

          <div class="name">
            Nessuna bici registrata
          </div>

          <br>

          <div class="muted">
            Registra la tua prima bici.
          </div>

        </div>

      `
    }


    <div class="grid">


      <button
        type="button"
        class="action"
        onclick="scan()"
      >

        <span class="ico">
          ⌗
        </span>

        <b>
          Scansiona QR
        </b>

        <br>

        <span class="muted">
          Verifica una bici
        </span>

      </button>


      <button
        type="button"
        class="action"
        onclick="add()"
      >

        <span class="ico">
          +
        </span>

        <b>
          Immatricola
        </b>

        <br>

        <span class="muted">
          Registra una bici
        </span>

      </button>


      <button
        type="button"
        class="action"
        onclick="quick()"
      >

        <span class="ico">
          ⚠
        </span>

        <b>
          Segnala furto
        </b>

        <br>

        <span class="muted">
          Proteggi la tua bici
        </span>

      </button>


      <button
        type="button"
        class="action"
        onclick="alert('Funzione trasferimento proprietà in arrivo')"
      >

        <span class="ico">
          ↔
        </span>

        <b>
          Trasferisci
        </b>

        <br>

        <span class="muted">
          Proprietà
        </span>

      </button>


    </div>

  `;

}


/* =========================================================
   PAGINA BICI
========================================================= */

function bikes(){

  closeM();


  navigation.style.display =
    "flex";


  app.innerHTML = `

    <h1>
      Le mie bici
    </h1>


    ${
      data.length
      ? data.map(card).join("")
      : `

        <div class="card">

          <div class="name">
            Nessuna bici registrata
          </div>

        </div>

      `
    }


    <button
      type="button"
      class="primary"
      onclick="add()"
    >

      + IMMATRICOLA UNA BICI

    </button>

  `;

}


/* =========================================================
   APRI MODULO
========================================================= */

function openForm(content){

  document.body.classList.add(
    "form-open"
  );


  modal.classList.add(
    "active"
  );


  modal.innerHTML = `

    <div class="modal-content">

      ${content}

    </div>

  `;


  modal.scrollTop = 0;


  setTimeout(
    () => {

      modal.scrollTop = 0;

    },
    50
  );

}


/* =========================================================
   CHIUDI MODULO
========================================================= */

function closeM(){

  document.body.classList.remove(
    "form-open"
  );


  modal.classList.remove(
    "active"
  );


  modal.innerHTML = "";

}


/* =========================================================
   IMMATRICOLA BICI
========================================================= */

function add(){

  openForm(`

    <button
      type="button"
      class="back"
      onclick="closeM()"
    >
      ‹ Annulla
    </button>


    <h1>
      Immatricola la tua bici
    </h1>


    <label for="bikeBrand">
      Marca
    </label>

    <input
      id="bikeBrand"
      type="text"
      autocomplete="off"
      placeholder="Es. Trek"
    >


    <label for="bikeModel">
      Modello
    </label>

    <input
      id="bikeModel"
      type="text"
      autocomplete="off"
      placeholder="Es. Fuel EX 8"
    >


    <label for="bikeYear">
      Anno
    </label>

    <input
      id="bikeYear"
      type="number"
      inputmode="numeric"
      placeholder="Es. 2022"
    >


    <label for="bikeColor">
      Colore
    </label>

    <input
      id="bikeColor"
      type="text"
      autocomplete="off"
      placeholder="Es. Nero / Rosso"
    >


    <label for="bikeFrame">
      Numero telaio
    </label>

    <input
      id="bikeFrame"
      type="text"
      autocomplete="off"
      placeholder="Numero telaio"
    >


    <div class="form-actions">

      <button
        type="button"
        id="createBikeButton"
        class="primary"
        onclick="createBike()"
      >

        IMMATRICOLA BICI

      </button>

    </div>

  `);

}


/* =========================================================
   CREA BICI
========================================================= */

async function createBike(){

  const brand =
    document
      .getElementById("bikeBrand")
      .value
      .trim();


  const model =
    document
      .getElementById("bikeModel")
      .value
      .trim();


  const year =
    document
      .getElementById("bikeYear")
      .value
      .trim();


  const color =
    document
      .getElementById("bikeColor")
      .value
      .trim();


  const frame =
    document
      .getElementById("bikeFrame")
      .value
      .trim();


  if(
    !brand ||
    !model ||
    !frame
  ){

    alert(
      "Inserisci marca, modello e numero telaio."
    );

    return;

  }


  const button =
    document.getElementById(
      "createBikeButton"
    );


  button.disabled = true;

  button.textContent =
    "SALVATAGGIO...";


  const bike = {

    id:
      generateId(),

    brand:
      brand,

    model:
      model,

    year:
      year || null,

    color:
      color || null,

    frame_number:
      frame,

    stolen:
      false,

    status:
      "active"

  };


  try{

    const {
      error
    } =
      await db
        .from("bikes")
        .insert([

          {

            biicode_id:
              bike.id,

            brand:
              bike.brand,

            model:
              bike.model,

            year:
              bike.year,

            color:
              bike.color,

            frame_number:
              bike.frame_number,

            stolen:
              false,

            status:
              "active"

          }

        ]);


    if(error){

      console.error(
        error
      );


      alert(
        "Errore durante il salvataggio su BIICODE:\n\n" +
        error.message
      );


      button.disabled = false;

      button.textContent =
        "IMMATRICOLA BICI";

      return;

    }


    data.unshift(
      bike
    );


    saveLocal();


    closeM();


    detail(
      bike.id
    );


  }catch(error){

    console.error(
      error
    );


    alert(
      "Impossibile collegarsi a Supabase."
    );


    button.disabled = false;

    button.textContent =
      "IMMATRICOLA BICI";

  }

}


/* =========================================================
   DETTAGLIO BICI
========================================================= */

function detail(idValue){

  const b =
    findBike(idValue);


  if(!b){

    alert(
      "Bici non trovata."
    );

    return;

  }


  openForm(`

    <button
      type="button"
      class="back"
      onclick="closeM()"
    >
      ‹ Indietro
    </button>


    <h1>

      ${escapeHTML(b.brand)}
      ${escapeHTML(b.model)}

    </h1>


    <div class="card">


      <div class="muted">
        BIICODE ID
      </div>


      <div class="name">
        ${escapeHTML(b.id)}
      </div>


      <div
        id="qr"
        class="qr"
      ></div>


      <div class="muted">
        NUMERO TELAIO
      </div>


      <div class="name">
        ${escapeHTML(
          b.frame_number || "-"
        )}
      </div>


      <br>


      <div class="muted">
        ANNO / COLORE
      </div>


      <div class="name">

        ${escapeHTML(
          b.year || "-"
        )}

        •

        ${escapeHTML(
          b.color || "-"
        )}

      </div>


      <div
        class="
          alert
          ${b.stolen ? "stolen" : ""}
        "
      >

        ${
          b.stolen
          ? "🔴 QUESTA BICI RISULTA RUBATA"
          : "🟢 QUESTA BICI RISULTA ATTIVA"
        }

      </div>


      <button
        type="button"
        id="toggleButton"
        class="primary"
        style="
          background:
          ${
            b.stolen
            ? "#22C55E"
            : "#EF4444"
          };
        "
        onclick="toggle('${escapeHTML(b.id)}')"
      >

        ${
          b.stolen
          ? "SEGNALA COME RECUPERATA"
          : "SEGNALA FURTO"
        }

      </button>


    </div>

  `);


  generateQR(
    b.id
  );

}


/* =========================================================
   GENERA QR
========================================================= */

function generateQR(bikeId){

  const qrElement =
    document.getElementById("qr");


  if(
    !qrElement ||
    typeof QRCode === "undefined"
  ){

    return;

  }


  qrElement.innerHTML = "";


  const publicUrl =
    window.location.origin +
    window.location.pathname +
    "?bike=" +
    encodeURIComponent(
      bikeId
    );


  new QRCode(
    qrElement,
    {

      text:
        publicUrl,

      width:
        190,

      height:
        190

    }
  );

}


/* =========================================================
   FURTO / RECUPERO
========================================================= */

async function toggle(idValue){

  const b =
    data.find(
      q => q.id === idValue
    );

  if(!b){
    alert("Bici non trovata.");
    return;
  }


  const nuovoStato =
    !b.stolen;


  /*
     Aggiorna Supabase
  */

  try{

    const {
      error
    } = await db
      .from("bikes")
      .update({
        stolen: nuovoStato
      })
      .eq(
        "biicode_id",
        idValue
      );


    if(error){

      console.error(
        "Errore aggiornamento furto:",
        error
      );

      alert(
        "Impossibile aggiornare lo stato della bici su Supabase."
      );

      return;

    }


    /*
       Aggiorna i dati locali
       SOLO dopo la conferma di Supabase
    */

    b.stolen =
      nuovoStato;

    save();


    /*
       Ricarica il dettaglio
    */

    detail(idValue);


  }catch(error){

    console.error(
      "Errore:",
      error
    );

    alert(
      "Errore di collegamento con Supabase."
    );

  }

}

/* =========================================================
   CARICA BICI DA SUPABASE
========================================================= */

async function loadData(){

  try{

    const {
      data:rows,
      error
    } =
      await db
        .from("bikes")
        .select(`
          biicode_id,
          brand,
          model,
          year,
          color,
          frame_number,
          stolen,
          status,
          created_at
        `)
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      console.warn(
        "Supabase:",
        error.message
      );


      data =
        loadLocal();


      return;

    }


    if(
      Array.isArray(rows)
    ){

      data =
        rows.map(
          row => ({

            id:
              row.biicode_id,

            brand:
              row.brand,

            model:
              row.model,

            year:
              row.year,

            color:
              row.color,

            frame_number:
              row.frame_number,

            stolen:
              row.stolen === true,

            status:
              row.status || "active",

            created_at:
              row.created_at

          })
        );


      saveLocal();

    }

  }catch(error){

    console.warn(
      "Errore caricamento:",
      error
    );


    data =
      loadLocal();

  }

}


/* =========================================================
   PAGINA PUBBLICA DEL QR
========================================================= */

async function publicBike(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const bikeId =
    params.get("bike");


  if(!bikeId){

    return false;

  }


  navigation.style.display =
    "none";


  app.innerHTML = `

    <div class="loading">
      Verifica BIICODE in corso...
    </div>

  `;


  try{

    const {
      data:row,
      error
    } =
      await db
        .from("bikes")
        .select(`
          biicode_id,
          brand,
          model,
          year,
          color,
          stolen,
          status
        `)
        .eq(
          "biicode_id",
          bikeId
        )
        .maybeSingle();


    if(error){

      throw error;

    }


    if(!row){

      app.innerHTML = `

        <h1>
          Bici non trovata
        </h1>


        <div class="card">

          <div class="name">
            Questo BIICODE non è associato
            a nessuna bici registrata.
          </div>

        </div>

      `;


      return true;

    }


    const isStolen =
      row.stolen === true;


    app.innerHTML = `

      <div class="muted">
        VERIFICA BIICODE
      </div>


      <h1>
        ${escapeHTML(row.brand)}
        ${escapeHTML(row.model)}
      </h1>


      <div class="card">


        <div class="muted">
          BIICODE ID
        </div>


        <div class="name">
          ${escapeHTML(row.biicode_id)}
        </div>


        <br>


        <div class="muted">
          ANNO
        </div>


        <div class="name">
          ${escapeHTML(
            row.year || "-"
          )}
        </div>


        <br>


        <div class="muted">
          COLORE
        </div>


        <div class="name">
          ${escapeHTML(
            row.color || "-"
          )}
        </div>


        <div
          class="
            alert
            ${isStolen ? "stolen" : ""}
          "
        >

          ${
            isStolen
            ? "🚨 ATTENZIONE: QUESTA BICI RISULTA RUBATA"
            : "🟢 QUESTA BICI RISULTA ATTIVA"
          }

        </div>


        <button
          type="button"
          class="primary"
          onclick="contactOwner()"
        >

          CONTATTA IL PROPRIETARIO

        </button>


      </div>

    `;


    return true;


  }catch(error){

    console.error(
      error
    );


    app.innerHTML = `

      <h1>
        Errore di verifica
      </h1>


      <div class="card">

        <div class="name">
          Non è stato possibile verificare
          questo BIICODE.
        </div>


        <br>


        <div class="muted">
          Riprova tra qualche istante.
        </div>

      </div>

    `;


    return true;

  }

}

async function startApp(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const bikeId =
    params.get("bike");


  /*
     Se siamo su un QR,
     carichiamo direttamente
     la bici richiesta da Supabase.
  */

  if(bikeId){

    await publicBike();

    return;

  }


  /*
     Altrimenti carichiamo
     l'app normale.
  */

  app.innerHTML = `

    <div class="loading">
      Caricamento BIICODE...
    </div>

  `;


  await loadData();


  home();

}


startApp();
