<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1320">

<title>BIICODE</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#0B1320;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
}

main{
  max-width:480px;
  margin:auto;
  padding:20px 20px 120px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:12px;
  background:#07101d;
  display:grid;
  place-items:center;
  font-size:25px;
  font-weight:900;
}

.logo b{
  color:#1565FF;
}

.head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:30px;
}

.brand{
  font-size:21px;
  font-weight:900;
}

.tag{
  font-size:8px;
  color:#9AA7B8;
  letter-spacing:1px;
}

h1{
  font-size:28px;
  margin:10px 0 18px;
}

.muted{
  color:#94A1B3;
  font-size:13px;
}

.card{
  background:#111D2D;
  border:1px solid #203149;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
}

.bike{
  display:flex;
  gap:15px;
  align-items:center;
}

.pic{
  width:90px;
  height:80px;
  flex:none;
  background:#0A1523;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:42px;
}

.name{
  font-size:17px;
  font-weight:800;
}

.id{
  font-size:12px;
  color:#94A1B3;
  margin-top:5px;
}

.status{
  display:inline-block;
  padding:4px 9px;
  border-radius:10px;
  font-size:10px;
  font-weight:800;
  margin-top:7px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action{
  background:#111D2D;
  color:white;
  border:1px solid #203149;
  border-radius:16px;
  padding:18px;
  text-align:left;
  min-height:110px;
  font-size:14px;
}

.ico{
  font-size:27px;
  color:#1565FF;
  display:block;
  margin-bottom:12px;
}

button{
  font:inherit;
  cursor:pointer;
}

.primary{
  width:100%;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#1565FF;
  color:white;
  font-weight:800;
  margin-top:8px;
}

input{
  width:100%;
  padding:14px;
  background:#111D2D;
  border:1px solid #2A3B52;
  border-radius:12px;
  color:white;
  font-size:16px;
  margin:7px 0 14px;
}

input:focus{
  outline:2px solid #1565FF;
  border-color:#1565FF;
}

label{
  font-size:12px;
  color:#AAB5C4;
}

.nav{
  position:fixed;
  z-index:20;
  bottom:0;
  left:0;
  right:0;
  height:82px;
  background:#0E1A2A;
  border-top:1px solid #203149;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav button{
  background:none;
  border:0;
  color:#9AA4B2;
  font-size:11px;
}

.plus{
  background:#1565FF!important;
  color:white!important;
  width:56px;
  height:56px;
  border-radius:50%;
  font-size:30px!important;
  margin-top:-25px;
}

/* FINESTRA MODULO */
.modal{
  position:fixed;
  z-index:50;
  top:0;
  left:0;
  right:0;
  bottom:110px;
  background:#0B1320;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:20px 20px 40px;
}

.modal > div{
  max-width:480px;
  margin:0 auto;
  padding-bottom:20px;
}

.back{
  background:none;
  border:0;
  color:#1565FF;
  font-size:18px;
  font-weight:800;
  padding:8px 0 18px;
}

.qr{
  background:white;
  padding:12px;
  border-radius:12px;
  width:max-content;
  margin:18px auto;
}

.alert{
  padding:14px;
  border-radius:12px;
  margin:15px 0;
  background:#10271C;
  color:#A9EFC4;
}

.stolen{
  background:#29151B;
  color:#FFB4BC;
}

/* SPAZIO EXTRA SOTTO IL PULSANTE */
.form-actions{
  padding-bottom:40px;
}
</style>
</head>

<body>

<main>

  <div class="head">

    <div class="logo">
      b<b>◯</b>
    </div>

    <div>
      <div class="brand">BIICODE</div>
      <div class="tag">
        LA TUA BICI. UN'IDENTITÀ UNICA.
      </div>
    </div>

  </div>

  <div id="app"></div>

</main>


<!-- NAVIGAZIONE -->

<div class="nav">

  <button onclick="home()">
    ⌂<br>
    Home
  </button>

  <button onclick="bikes()">
    🚲<br>
    Bici
  </button>

  <button class="plus" onclick="add()">
    +
  </button>

  <button onclick="activity()">
    ▤<br>
    Attività
  </button>

  <button onclick="profile()">
    ○<br>
    Profilo
  </button>

</div>


<!-- MODALE -->

<div id="modal"></div>


<!-- QR CODE -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   DATI LOCALI
========================= */

let data =
  JSON.parse(localStorage.getItem("biicode") || "null")
  ||
  [
    {
      id:"IT-7F82K91X",
      brand:"Trek",
      model:"Fuel EX 8",
      year:"2022",
      color:"Nero / Rosso",
      frame_number:"WTU1234567890",
      stolen:false,
      status:"active"
    }
  ];


/* =========================
   SUPABASE
========================= */

const { createClient } = supabase;

const SUPABASE_URL =
  "https://swzkrwdqfgetwcmaiqty.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_inpwNp-Uqe-X4BeTl54uiQ_1ARA1HNb";

const db =
  createClient(SUPABASE_URL,SUPABASE_KEY);


/* =========================
   SALVATAGGIO LOCALE
========================= */

function save(){

  localStorage.setItem(
    "biicode",
    JSON.stringify(data)
  );

}


/* =========================
   GENERATORE ID
========================= */

function id(){

  let c =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let s = "IT-";

  for(let i=0;i<8;i++){

    s += c[Math.floor(Math.random()*c.length)];

  }

  return s;

}


/* =========================
   CARD BICI
========================= */

function card(b){

  return `
    <div
      class="card bike"
      onclick="detail('${b.id}')"
    >

      <div class="pic">
        🚲
      </div>

      <div>

        <div class="name">
          ${b.brand} ${b.model}
        </div>

        <div class="id">
          ${b.id}
        </div>

        <span
          class="status"
          style="background:${b.stolen ? '#EF4444' : '#22C55E'}"
        >
          ${b.stolen ? 'RUBATA' : 'ATTIVA'}
        </span>

      </div>

    </div>
  `;

}


/* =========================
   HOME
========================= */

function home(){

  document.getElementById("app").innerHTML = `

    <div class="muted">
      Ciao Claudio 👋
    </div>

    <h1>
      Le mie bici
    </h1>

    ${data.map(card).join("")}

    <div class="grid">

      <button
        class="action"
        onclick="scan()"
      >
        <span class="ico">⌗</span>
        <b>Scansiona QR</b>
        <br>
        <span class="muted">
          Verifica una bici
        </span>
      </button>


      <button
        class="action"
        onclick="add()"
      >
        <span class="ico">+</span>
        <b>Immatricola</b>
        <br>
        <span class="muted">
          Registra una bici
        </span>
      </button>


      <button
        class="action"
        onclick="quick()"
      >
        <span class="ico">⚠</span>
        <b>Segnala furto</b>
        <br>
        <span class="muted">
          Proteggi la tua bici
        </span>
      </button>


      <button
        class="action"
        onclick="alert('Funzione in arrivo')"
      >
        <span class="ico">↔</span>
        <b>Trasferisci</b>
        <br>
        <span class="muted">
          Proprietà
        </span>
      </button>

    </div>

  `;

}


/* =========================
   PAGINA BICI
========================= */

function bikes(){

  document.getElementById("app").innerHTML = `

    <h1>
      Le mie bici
    </h1>

    ${data.map(card).join("")}

    <button
      class="primary"
      onclick="add()"
    >
      + IMMATRICOLA UNA BICI
    </button>

  `;

}


/* =========================
   IMMATRICOLA
========================= */

function add(){

  const modal =
    document.getElementById("modal");

  modal.innerHTML = `

    <div>

      <button
        class="back"
        onclick="closeM()"
      >
        ‹ Annulla
      </button>


      <h1>
        Immatricola la tua bici
      </h1>


      <label>
        Marca
      </label>

      <input
        id="bikeBrand"
        placeholder="Es. Trek"
      >


      <label>
        Modello
      </label>

      <input
        id="bikeModel"
        placeholder="Es. Fuel EX 8"
      >


      <label>
        Anno
      </label>

      <input
        id="bikeYear"
        type="number"
        placeholder="Es. 2022"
      >


      <label>
        Colore
      </label>

      <input
        id="bikeColor"
        placeholder="Es. Nero"
      >


      <label>
        Numero telaio
      </label>

      <input
        id="bikeFrame"
        placeholder="Numero telaio"
      >


      <div class="form-actions">

        <button
          class="primary"
          onclick="createBike()"
        >
          IMMATRICOLA BICI
        </button>

      </div>

    </div>

  `;

}


/* =========================
   CREA BICI
========================= */

async function createBike(){

  const brand =
    document.getElementById("bikeBrand").value.trim();

  const model =
    document.getElementById("bikeModel").value.trim();

  const year =
    document.getElementById("bikeYear").value.trim();

  const color =
    document.getElementById("bikeColor").value.trim();

  const frame =
    document.getElementById("bikeFrame").value.trim();


  if(!brand || !model || !frame){

    alert(
      "Inserisci marca, modello e numero telaio"
    );

    return;

  }


  const x = {

    id:id(),

    brand:brand,

    model:model,

    year:year,

    color:color,

    frame_number:frame,

    stolen:false,

    status:"active"

  };


  const {error} = await db
    .from("bikes")
    .insert([{

      biicode_id:x.id,

      brand:x.brand,

      model:x.model,

      year:x.year,

      color:x.color,

      frame_number:x.frame_number,

      status:x.status

    }]);


  if(error){

    alert(
      "Errore salvataggio Supabase: "
      + error.message
    );

    return;

  }


  data.unshift(x);

  save();

  closeM();

  detail(x.id);

}


/* =========================
   DETTAGLIO BICI
========================= */

function detail(x){

  const b =
    data.find(q => q.id === x);


  if(!b){

    alert("Bici non trovata");

    return;

  }


  document.getElementById("modal").innerHTML = `

    <div>

      <button
        class="back"
        onclick="closeM()"
      >
        ‹ Indietro
      </button>


      <h1>
        ${b.brand} ${b.model}
      </h1>


      <div class="card">

        <div class="muted">
          BIICODE ID
        </div>

        <div class="name">
          ${b.id}
        </div>


        <div
          id="qr"
          class="qr"
        ></div>


        <div class="muted">
          NUMERO TELAIO
        </div>

        <div class="name">
          ${b.frame_number || "-"}
        </div>

        <br>


        <div class="muted">
          ANNO / COLORE
        </div>

        <div class="name">
          ${b.year || "-"}
          •
          ${b.color || "-"}
        </div>


        <div
          class="alert ${b.stolen ? 'stolen' : ''}"
        >
          ${
            b.stolen
            ? '🔴 QUESTA BICI RISULTA RUBATA'
            : '🟢 QUESTA BICI RISULTA ATTIVA'
          }
        </div>


        <button
          class="primary"
          style="background:${b.stolen ? '#22C55E' : '#EF4444'}"
          onclick="toggle('${b.id}')"
        >
          ${
            b.stolen
            ? 'SEGNALA COME RECUPERATA'
            : 'SEGNALA FURTO'
          }
        </button>

      </div>

    </div>

  `;


  new QRCode(
    document.getElementById("qr"),
    {
      text:"BIICODE:"+b.id,
      width:190,
      height:190
    }
  );

}


/* =========================
   FURTO / RECUPERO
========================= */

function toggle(x){

  const b =
    data.find(q => q.id === x);

  if(!b) return;

  b.stolen =
    !b.stolen;

  save();

  detail(x);

}


function quick(){

  if(data.length){

    toggle(data[0].id);

  }

}


/* =========================
   SCANNER
========================= */

function scan(){

  alert(
    "Lo scanner QR sarà collegato alla fotocamera nella prossima versione."
  );

}


/* =========================
   ATTIVITÀ
========================= */

function activity(){

  document.getElementById("app").innerHTML = `

    <h1>
      Attività
    </h1>

    <div class="card">

      <b>
        Bici registrata
      </b>

      <div class="muted">
        BIICODE • Oggi
      </div>

    </div>


    <div class="card">

      <b>
        QR pronto
      </b>

      <div class="muted">
        Identificativo associato
      </div>

    </div>

  `;

}


/* =========================
   PROFILO
========================= */

function profile(){

  document.getElementById("app").innerHTML = `

    <h1>
      Profilo
    </h1>

    <div class="card">

      <div class="name">
        Claudio
      </div>

      <div class="muted">
        Account BIICODE demo
      </div>

      <br>

      <div class="muted">
        Bici registrate:
        ${data.length}
      </div>

    </div>

  `;

}


/* =========================
   CHIUDI MODALE
========================= */

function closeM(){

  document.getElementById("modal").innerHTML = "";

}


/* =========================
   CARICAMENTO SUPABASE
========================= */

async function loadData(){

  const {
    data:rows,
    error
  } =
    await db
      .from("bikes")
      .select("*");


  if(error){

    console.log(
      "Errore caricamento Supabase:",
      error.message
    );

    home();

    return;

  }


  if(rows && rows.length){

    data =
      rows.map(r => ({

        id:r.biicode_id,

        brand:r.brand,

        model:r.model,

        year:r.year,

        color:r.color,

        frame_number:r.frame_number,

        stolen:false,

        status:r.status || "active"

      }));


    save();

  }


  home();

}


/* =========================
   AVVIO APP
========================= */

loadData();

</script>

</body>
</html>
