<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  margin:0;
  padding:0;
  background:#0B1320;
}

body{

  padding:0;

  min-height:100dvh;

}


/* =========================================================
   APP PRINCIPALE
========================================================= */

main{
  width:100%;
  max-width:480px;

  margin:0 auto;

  padding:
    20px
    20px
    calc(110px + env(safe-area-inset-bottom));

  min-height:100dvh;
}


/* =========================================================
   HEADER
========================================================= */

.head{
  display:flex;
  align-items:center;
  gap:12px;

  margin-bottom:30px;
}

.logo{
  width:48px;
  height:48px;

  flex:none;

  border-radius:12px;

  background:#07101D;

  display:grid;
  place-items:center;

  font-size:25px;
  font-weight:900;
}

.logo b{
  color:#1565FF;
}

.brand{
  font-size:21px;
  font-weight:900;
}

.tag{
  margin-top:2px;

  font-size:8px;

  color:#9AA7B8;

  letter-spacing:1px;
}


/* =========================================================
   TESTI
========================================================= */

h1{
  margin:10px 0 18px;

  font-size:28px;
  line-height:1.15;

  font-weight:900;
}

.muted{
  color:#94A1B3;
  font-size:13px;
}


/* =========================================================
   CARD
========================================================= */

.card{
  background:#111D2D;

  border:1px solid #203149;

  border-radius:18px;

  padding:16px;

  margin-bottom:14px;
}

.bike{
  display:flex;
  gap:15px;
  align-items:center;

  cursor:pointer;
}

.pic{
  width:90px;
  height:80px;

  flex:none;

  background:#0A1523;

  border-radius:14px;

  display:grid;
  place-items:center;

  font-size:42px;

  overflow:hidden;
}

.pic img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.name{
  font-size:17px;
  font-weight:800;
}

.id{
  margin-top:5px;

  font-size:12px;

  color:#94A1B3;
}

.status{
  display:inline-block;

  padding:4px 9px;

  border-radius:10px;

  margin-top:7px;

  font-size:10px;
  font-weight:800;
}


/* =========================================================
   GRIGLIA HOME
========================================================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.action{
  width:100%;

  min-height:110px;

  padding:18px;

  background:#111D2D;
  color:#FFFFFF;

  border:1px solid #203149;

  border-radius:16px;

  text-align:left;

  font-size:14px;

  cursor:pointer;
}

.action:active{
  transform:scale(.98);
}

.ico{
  display:block;

  margin-bottom:12px;

  font-size:27px;

  color:#1565FF;
}


/* =========================================================
   BUTTON
========================================================= */

button{
  font:inherit;
  cursor:pointer;

  -webkit-appearance:none;
  appearance:none;
}

.primary{
  display:block;

  width:100%;

  min-height:58px;

  border:0;

  border-radius:14px;

  color:#FFFFFF;

  font-size:16px;

  text-align:center;

  cursor:pointer;

}

.primary:active{
  transform:scale(.98);
}

.primary:disabled{

}


/* =========================================================

========================================================= */

label{

  margin-top:4px;

  font-size:13px;
  font-weight:600;

  color:#AAB5C4;
}

input{

  min-height:58px;

  padding:15px;

  margin:

  background:#111D2D;

  border:1px solid #2A3B52;

  border-radius:14px;

  color:#FFFFFF;

  outline:none;

}

}

input:focus{

}


/* =========================================================
   FOTO
========================================================= */

.photo-box{

.photo-info{

}

.photo-add:active{

}

.photo-grid{

}

.photo-item{

  border-radius:12px;

  background:#07101D;

  border:1px solid #203149;

  height:100%;

========================================================= */

.modal{

}

.modal.active{

}

.modal-content{

  padding-bottom:40px;

/* =========================================================

========================================================= */

.back{

  padding:8px 0 20px;

  border:0;

/* =========================================================

.form-actions{

/* =========================================================

  padding:12px;

/* =========================================================

========================================================= */

.alert{

.stolen{

/* =========================================================

========================================================= */

.photo-viewer{

@media(max-width:380px){

</style>

<script>


/* =========================================================
   SUPABASE
========================================================= */

const {
  createClient
} = supabase;


const SUPABASE_URL =
  "https://swzkrwdqfgetwcmaiqty.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_inpwNp-Uqe-X4BeTl54uiQ_1ARA1HNb";


const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   CONFIGURAZIONE FOTO
========================================================= */

const PHOTO_BUCKET =
  "bike-photos";


const MAX_PHOTOS =
  5;


/* =========================================================
   DATI
========================================================= */

let data = [];


/* Foto temporanee durante immatricolazione */

let selectedPhotos = [];


/* =========================================================
   ELEMENTI
========================================================= */

const app =
  document.getElementById("app");


const modal =
  document.getElementById("modal");


const navigation =
  document.getElementById("navigation");


/* =========================================================
   CACHE LOCALE
========================================================= */

function save(){

  localStorage.setItem(
    "biicode",
    JSON.stringify(data)
  );

}


function loadLocal(){

  try{

    const local =
      JSON.parse(
        localStorage.getItem("biicode") || "[]"
      );

    if(Array.isArray(local)){

      data =
        local.map(
          normalizeBike
        );

    }

  }catch(error){

    console.warn(
      "Errore cache locale:",
      error
    );

    data = [];

  }

}


/* =========================================================
   GENERA BIICODE ID
========================================================= */

function generateId(){

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "IT-";

  for(
    let i = 0;
    i < 8;
    i++
  ){

    result +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }

  return result;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   NORMALIZZA FOTO
========================================================= */

function normalizePhotos(value){

  if(Array.isArray(value)){

    return value.filter(Boolean);

  }

  return [];

}


/* =========================================================
   NORMALIZZA BICI
========================================================= */

function normalizeBike(row){

  return {

    id:
      row.biicode_id ||
      row.id ||
      "",

    brand:
      row.brand ||
      "",

    model:
      row.model ||
      "",

    year:
      row.year ||
      "",

    color:
      row.color ||
      "",

    frame_number:
      row.frame_number ||
      "",

    stolen:
      row.stolen === true,

    status:
      row.status ||
      "active",

    photos:
      normalizePhotos(
        row.photos
      ),

    created_at:
      row.created_at ||
      null

  };

}


/* =========================================================
   URL FOTO SUPABASE
========================================================= */

function getPhotoUrl(path){

  if(!path){

    return "";

  }


  if(
    String(path).startsWith("http://") ||
    String(path).startsWith("https://")
  ){

    return path;

  }


  const {
    data:publicData
  } = db
    .storage
    .from(PHOTO_BUCKET)
    .getPublicUrl(path);


  return publicData?.publicUrl || "";

}


/* =========================================================
   ELIMINA FILE CARICATI IN CASO DI ERRORE
========================================================= */

async function deleteUploadedPhotos(paths){

  if(
    !Array.isArray(paths) ||
    !paths.length
  ){

    return;

  }


  try{

    const {
      error
    } = await db
      .storage
      .from(PHOTO_BUCKET)
      .remove(paths);


    if(error){

      console.warn(
        "Impossibile eliminare foto temporanee:",
        error
      );

    }

  }catch(error){

    console.warn(
      "Errore pulizia foto:",
      error
    );

  }

}


/* =========================================================
   FOTO COPERTINA
========================================================= */

function bikeCover(b){

  if(
    b.photos &&
    b.photos.length
  ){

    const url =
      getPhotoUrl(
        b.photos[0]
      );


    if(url){

      return `

        <img
          src="${escapeHTML(url)}"
          alt="Foto bicicletta"
          loading="lazy"
        >

      `;

    }

  }


  return "🚲";

}


/* =========================================================
   CARD BICI
========================================================= */

function card(b){

  const stolen =
    b.stolen === true;


  return `

    <div
      class="card bike"
      onclick="detail('${escapeHTML(b.id)}')"
    >

      <div class="pic">

        ${bikeCover(b)}

      </div>


      <div>

        <div class="name">

          ${escapeHTML(b.brand)}
          ${escapeHTML(b.model)}

        </div>


        <div class="id">

          ${escapeHTML(b.id)}

        </div>


        <span
          class="status"
          style="
            background:
            ${stolen
              ? "#EF4444"
              : "#22C55E"};
          "
        >

          ${stolen
            ? "RUBATA"
            : "ATTIVA"}

        </span>

      </div>

    </div>

  `;

}


/* =========================================================
   HOME
========================================================= */

function home(){

  closeM();

  navigation.style.display =
    "flex";


  app.innerHTML = `

    <div class="muted">
      Ciao Claudio 👋
    </div>


    <h1>
      Le mie bici
    </h1>


    ${
      data.length
      ? data.map(card).join("")
      : `

        <div class="card">

            Nessuna bici registrata
          </div>

          <br>

          <div class="muted">
            Registra la tua prima bici.
          </div>

        </div>

      `
    }


    <div class="grid">


      <button

      >

        <span class="ico">
          ⌗
        </span>

        <b>
          Scansiona QR
        </b>

        <br>

        <span class="muted">
          Verifica una bici
        </span>

      </button>


      <button

        class="action"
        onclick="add()"
      >

        <span class="ico">
          +
        </span>

        <b>
          Immatricola
        </b>

        <br>

        <span class="muted">
          Registra una bici
        </span>

      </button>


      <button
        type="button"
        class="action"
        onclick="quick()"
      >

        <span class="ico">
          ⚠
        </span>

        <b>
          Segnala furto
        </b>

        <br>

        <span class="muted">
          Proteggi la tua bici
        </span>

      </button>


      <button
        type="button"
        class="action"
        onclick="alert('Funzione trasferimento in arrivo')"
      >

        <span class="ico">
          ↔
        </span>

        <b>
          Trasferisci
        </b>

        <br>

        <span class="muted">
          Proprietà
        </span>

      </button>


    </div>

  `;

}


/* =========================================================
   BICI
========================================================= */

function bikes(){

  closeM();

  navigation.style.display =
    "flex";


  app.innerHTML = `

    <h1>
      Le mie bici
    </h1>


    ${
      data.length
      ? data.map(card).join("")
      : `

        <div class="card">

          <div class="name">
            Nessuna bici
          </div>

        </div>

      `
    }


    <button

      onclick="add()"
    >

      + IMMATRICOLA UNA BICI

    </button>

  `;

/* =========================================================
   APRI MODULO
========================================================= */

function openForm(content){

  document.body.classList.add(
    "form-open"
  );

  modal.classList.add(
    "active"
  );

  modal.innerHTML = `

    <div class="modal-content">

      ${content}

    </div>

  `;


  modal.scrollTop = 0;


  setTimeout(() => {

    modal.scrollTop = 0;

  },50);

}


/* =========================================================
   IMMATRICOLA
========================================================= */

function add(){

  clearSelectedPhotos();


  openForm(`

    <button
      type="button"
      class="back"
      onclick="closeM(); home();"
    >
      ‹ Annulla
    </button>


    <h1>
      Immatricola la tua bici
    </h1>


    <label for="bikeBrand">
      Marca
    </label>

    <input
      id="bikeBrand"
      type="text"
      autocomplete="off"
      placeholder="Es. Trek"
    >


    <label for="bikeModel">
      Modello
    </label>

    <input
      id="bikeModel"
      type="text"
      autocomplete="off"
      placeholder="Es. Fuel EX 8"
    >


    <label for="bikeYear">
      Anno
    </label>

    <input
      id="bikeYear"
      type="number"
      inputmode="numeric"
      placeholder="Es. 2022"
    >


    <label for="bikeColor">
      Colore
    </label>

    <input
      id="bikeColor"
      type="text"
      autocomplete="off"
      placeholder="Es. Nero"
    >


    <label for="bikeFrame">
      Numero telaio
    </label>

    <input
      id="bikeFrame"
      type="text"
      autocomplete="off"
      placeholder="Numero telaio"
    >


    <label>
      Fotografie della bici
    </label>


    <div class="photo-box">


      <div class="photo-info">

        Puoi aggiungere fino a
        ${MAX_PHOTOS} fotografie della bicicletta.

      </div>


      <input
        id="bikePhotos"
        type="file"
        accept="image/*"
        multiple
        capture="environment"
        style="display:none"
        onchange="handlePhotoSelection(event)"
      >


      <button
        type="button"
        class="photo-add"
        onclick="document.getElementById('bikePhotos').click()"

/* =========================================================
   SELEZIONE FOTO
========================================================= */

function handlePhotoSelection(event){

  const files =
    Array.from(
      event.target.files || []
    );


  if(!files.length){

    return;

  }


  const availableSlots =
    MAX_PHOTOS -
    selectedPhotos.length;


  if(availableSlots <= 0){

    alert(
      `Puoi caricare al massimo ${MAX_PHOTOS} foto.`
    );

    event.target.value = "";

    return;

  }


  const filesToAdd =
    files.slice(
      0,
      availableSlots
    );


  if(
    files.length >
    availableSlots
  ){

    alert(
      `Sono state aggiunte solo ${availableSlots} foto perché il limite è ${MAX_PHOTOS}.`
    );

  }


  filesToAdd.forEach(file => {

    if(
      !file.type ||
      !file.type.startsWith("image/")
    ){

      return;

    }


    const preview =
      URL.createObjectURL(file);


    selectedPhotos.push({

      file:
        file,

      preview:
        preview

    });

  });


  event.target.value = "";


  renderPhotoPreview();

}


/* =========================================================
   ANTEPRIMA FOTO
========================================================= */

function renderPhotoPreview(){

  const container =
    document.getElementById(
      "photoPreview"
    );


  if(!container){

    return;

  }


  container.innerHTML =
    selectedPhotos
      .map(
        (photo,index) => `

          <div class="photo-item">

            <img
              src="${escapeHTML(photo.preview)}"
              alt="Anteprima foto ${index + 1}"
            >


            <button
              type="button"
              class="remove-photo"
              onclick="removeSelectedPhoto(${index})"
            >
              ×
            </button>

          </div>

        `
      )
      .join("");

}


/* =========================================================
   ELIMINA FOTO SELEZIONATA
========================================================= */

function removeSelectedPhoto(index){

  const photo =
    selectedPhotos[index];


  if(
    photo &&
    photo.preview
  ){

    URL.revokeObjectURL(
      photo.preview
    );

  }


  selectedPhotos.splice(
    index,
    1
  );


  renderPhotoPreview();

}


/* =========================================================
   PULISCI FOTO TEMPORANEE
========================================================= */

function clearSelectedPhotos(){

  selectedPhotos.forEach(photo => {

    if(
      photo &&
      photo.preview
    ){

      URL.revokeObjectURL(
        photo.preview
      );

    }

  });


  selectedPhotos = [];

}


/* =========================================================
   CREA BICI
========================================================= */

async function createBike(){

  const brandInput =
    document.getElementById("bikeBrand");

  const modelInput =
    document.getElementById("bikeModel");

  const yearInput =
    document.getElementById("bikeYear");

  const colorInput =
    document.getElementById("bikeColor");

  const frameInput =
    document.getElementById("bikeFrame");


  const brand =
    brandInput.value.trim();

  const model =
    modelInput.value.trim();

  const year =
    yearInput.value.trim();

  const color =
    colorInput.value.trim();

  const frame =
    frameInput.value.trim();


  if(
    !brand ||
    !model ||
    !frame
  ){

    alert(
      "Inserisci marca, modello e numero telaio."
    );

    return;

  }


  const button =
    document.getElementById(
      "createBikeButton"
    );


  button.disabled = true;

  button.textContent =
    "CREAZIONE BICI...";


  const bikeId =
    generateId();


  const uploadedPhotos =
    [];


  try{


    /* -----------------------------------------------------
       1. CARICAMENTO FOTO
    ----------------------------------------------------- */

    if(selectedPhotos.length){

      button.textContent =
        "CARICAMENTO FOTO...";


      for(
        let i = 0;
        i < selectedPhotos.length;
        i++
      ){

        const photo =
          selectedPhotos[i];


        const file =
          photo.file;


        let extension =
          file.name
            .split(".")
            .pop()
            ?.toLowerCase();


        if(
          !extension ||
          extension.length > 10
        ){

          extension = "jpg";

        }


        extension =
          extension.replace(
            /[^a-z0-9]/gi,
            ""
          ) || "jpg";


        const filePath =
          `${bikeId}/${Date.now()}_${i}.${extension}`;


        const {
          error:uploadError
        } = await db
          .storage
          .from(PHOTO_BUCKET)
          .upload(
            filePath,
            file,
            {

              cacheControl:
                "3600",

              upsert:
                false,

              contentType:
                file.type

            }
          );


        if(uploadError){

          throw new Error(
            "Impossibile caricare una fotografia: " +
            uploadError.message
          );

        }


        uploadedPhotos.push(
          filePath
        );

      }

    }


    /* -----------------------------------------------------
       2. CREA BICI NEL DATABASE
    ----------------------------------------------------- */

    button.textContent =
      "IMMATRICOLAZIONE...";


    const {
      data:insertedRows,
      error
    } = await db
      .from("bikes")
      .insert([{

        biicode_id:
          bikeId,

        brand:
          brand,

        model:
          model,

        year:
          year,

        color:
          color,

        frame_number:
          frame,

        stolen:
          false,

        status:
          "active",

        photos:
          uploadedPhotos

      }])
      .select();


    if(error){

      throw new Error(
        error.message
      );

    }


    /* -----------------------------------------------------
       3. AGGIORNA DATI LOCALI
    ----------------------------------------------------- */

    let bike;


    if(
      insertedRows &&
      insertedRows.length
    ){

      bike =
        normalizeBike(
          insertedRows[0]
        );

    }else{

      bike = {

        id:
          bikeId,

        brand:
          brand,

        model:
          model,

        year:
          year,

        color:
          color,

        frame_number:
          frame,

        stolen:
          false,

        status:
          "active",

        photos:
          uploadedPhotos,

        created_at:
          new Date().toISOString()

      };

    }


    data.unshift(
      bike
    );


    save();


    clearSelectedPhotos();


    /* -----------------------------------------------------
       4. MOSTRA DETTAGLIO
    ----------------------------------------------------- */

    closeM();


    detail(
      bike.id
    );


  }catch(error){

    console.error(
      "Errore immatricolazione:",
      error
    );


    /* Se il database fallisce dopo l'upload,
       eliminiamo le foto già caricate */

    await deleteUploadedPhotos(
      uploadedPhotos
    );


    alert(
      "Errore durante l'immatricolazione.\n\n" +
      error.message
    );


    button.disabled =
      false;


    button.textContent =
      "IMMATRICOLA BICI";

  }

}

function detail(idValue){

  const b =

      q => q.id === idValue

  if(!b){

    alert(
      "Bici non trovata."
    );

    return;

  }


  const stolen =
    b.stolen === true;


  openForm(`

    <button
      type="button"
      class="back"
      onclick="closeM(); home();"
    >
      ‹ Indietro
    </button>


    <h1>
      ${escapeHTML(b.brand)}
      ${escapeHTML(b.model)}
    </h1>


    <div class="card">


      <div class="muted">
        BIICODE ID
      </div>


      <div class="name">
        ${escapeHTML(b.id)}
      </div>


      <div
        id="qr"
        class="qr"
      ></div>


      <div class="muted">
        NUMERO TELAIO
      </div>


      <div class="name">
        ${escapeHTML(
          b.frame_number || "-"
        )}
      </div>


      <br>


      <div class="muted">
        ANNO / COLORE
      </div>


      <div class="name">

        ${escapeHTML(
          b.year || "-"
        )}

        •

        ${escapeHTML(
          b.color || "-"
        )}

      </div>


      ${renderBikePhotos(b.photos)}


      <div
        class="
          alert
          ${stolen ? "stolen" : ""}
        "
      >

        ${
          stolen
          ? "🔴 QUESTA BICI RISULTA RUBATA"
          : "🟢 QUESTA BICI RISULTA ATTIVA"
        }

      </div>


      <button
        type="button"
        id="toggleButton"
        class="primary"
        style="
          background:
          ${stolen
            ? "#22C55E"
            : "#EF4444"};
        "
        onclick="toggle('${escapeHTML(b.id)}')"
      >

        ${
          stolen
          ? "SEGNALA COME RECUPERATA"
          : "SEGNALA FURTO"
        }

      </button>


    </div>

  `);


  const qrElement =
    document.getElementById("qr");


  if(
    qrElement &&
    typeof QRCode !== "undefined"
  ){

    const publicUrl =
      window.location.origin +
      window.location.pathname +
      "?bike=" +
      encodeURIComponent(
        b.id
      );


    new QRCode(
      qrElement,
      {

        text:
          publicUrl,

        width:
          190,

        height:
          190

      }
    );

  }

}

/* =========================================================
   SEGNALA FURTO / RECUPERA BICI
========================================================= */

async function toggle(idValue){

  const b =
    data.find(
      q => q.id === idValue
    );


  if(!b){

    alert(
      "Bici non trovata."
    );

    return;

  }


  const nuovoStato =
    !b.stolen;


  const button =
    document.getElementById(
      "toggleButton"
    );


  if(button){

    button.disabled = true;

    button.textContent =
      nuovoStato
      ? "SEGNALAZIONE IN CORSO..."
      : "AGGIORNAMENTO IN CORSO...";

  }


  try{

    const {
      data:updatedRows,
      error
    } = await db
      .from("bikes")
      .update({

        stolen:
          nuovoStato

      })
      .eq(
        "biicode_id",
        idValue
      )
      .select();


    if(error){

      throw new Error(
        error.message
      );

    }


    if(
      !updatedRows ||
      updatedRows.length === 0
    ){

      throw new Error(
        "Nessuna bici aggiornata."
      );

    }


    const updatedBike =
      normalizeBike(
        updatedRows[0]
      );


    const index =
      data.findIndex(
        q => q.id === idValue
      );


    if(index !== -1){

      data[index] =
        updatedBike;

    }


    save();


    detail(
      idValue
    );


  }catch(error){

    console.error(
      "Errore aggiornamento:",
      error
    );


    alert(
      "Impossibile aggiornare lo stato della bici.\n\n" +
      error.message
    );


    if(button){

      button.disabled = false;

      button.textContent =
        b.stolen
        ? "SEGNALA COME RECUPERATA"
        : "SEGNALA FURTO";

    }

  }

}

/* =========================================================

========================================================= */

function closeM(){

  document.body.classList.remove(
    "form-open"
  );

  modal.classList.remove(
    "active"
  );

  modal.innerHTML = "";

}


/* =========================================================
   CARICA TUTTE LE BICI DA SUPABASE
========================================================= */

async function loadData(){

  try{

    const {
      data:rows,
      error
    } = await db
      .from("bikes")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      console.error(
        "Errore caricamento Supabase:",
        error
      );


      loadLocal();

      return;

    }


    data =
      Array.isArray(rows)
      ? rows.map(
          normalizeBike
        )
      : [];


    save();


  }catch(error){

    console.error(
      "Errore collegamento Supabase:",
      error
    );


    loadLocal();

  }

}


/* =========================================================
   CARICA UNA SOLA BICI PUBBLICA
========================================================= */

async function loadPublicBike(bikeId){

  try{

    const {
      data:rows,
      error
    } = await db
      .from("bikes")
      .select("*")
      .eq(
        "biicode_id",
        bikeId
      )
      .limit(1);


    if(error){

      console.error(
        "Errore ricerca bici:",
        error
      );


      return null;

    }


    if(
      !rows ||
      rows.length === 0
    ){

      return null;

    }


    return normalizeBike(
      rows[0]
    );


  }catch(error){

    console.error(
      "Errore:",
      error
    );

    return null;

  }

}
