function showResetPassword(){header.style.display='none';navigation.style.display='none';document.querySelector('main').style.padding='0';app.innerHTML=`<div class="login-screen"><div class="login-box"><div class="login-logo">b<b>◯</b></div><div class="login-brand">BIICODE</div><div class="login-tag">NUOVA PASSWORD</div><div class="login-card"><div id="authMessage" class="auth-message"></div><div class="login-title">Imposta la nuova password</div><label>Nuova password</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="Minimo 6 caratteri"><label>Conferma password</label><input id="newPasswordConfirm" type="password" autocomplete="new-password" placeholder="Ripeti la password"><button class="primary" onclick="updatePassword()">SALVA PASSWORD</button></div></div></div>`}
async function loginUser(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value,b=document.getElementById('loginButton');if(!email||!password)return authMsg('Inserisci email e password.');b.disabled=true;b.textContent='ACCESSO IN CORSO...';try{const {data:a,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;currentUser=a.user;await startPrivateApp()}catch(e){authMsg(e.message||'Impossibile effettuare l’accesso.');b.disabled=false;b.textContent='ACCEDI'}}
async function registerUser(){const email=document.getElementById('registerEmail').value.trim(),password=document.getElementById('registerPassword').value,confirm=document.getElementById('registerPasswordConfirm').value,b=document.getElementById('registerButton');if(!email||!password||!confirm)return authMsg('Compila tutti i campi.');if(password.length<6)return authMsg('La password deve contenere almeno 6 caratteri.');if(password!==confirm)return authMsg('Le password non coincidono.');b.disabled=true;b.textContent='CREAZIONE ACCOUNT...';try{const {data:a,error}=await db.auth.signUp({email,password});if(error)throw error;if(a.user&&!a.session){authMsg('Account creato. Controlla la tua email per confermare l’iscrizione.','success');b.disabled=false;b.textContent='CREA ACCOUNT';return}currentUser=a.user;await startPrivateApp()}catch(e){authMsg(e.message||'Impossibile creare l’account.');b.disabled=false;b.textContent='CREA ACCOUNT'}}
async function resetPassword(){const email=document.getElementById('resetEmail').value.trim(),b=document.getElementById('resetButton');if(!email)return authMsg('Inserisci la tua email.');b.disabled=true;b.textContent='INVIO IN CORSO...';try{const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;authMsg('Email inviata. Controlla la tua casella di posta.','success');b.textContent='EMAIL INVIATA'}catch(e){authMsg(e.message||'Impossibile inviare l’email.');b.disabled=false;b.textContent='INVIA ISTRUZIONI'}}
async function updatePassword(){const p=document.getElementById('newPassword').value,c=document.getElementById('newPasswordConfirm').value;if(p.length<6)return authMsg('La password deve contenere almeno 6 caratteri.');if(p!==c)return authMsg('Le password non coincidono.');try{const {error}=await db.auth.updateUser({password:p});if(error)throw error;authMsg('Password aggiornata. Ora puoi usare BIICODE.','success');setTimeout(startApp,900)}catch(e){authMsg(e.message||'Impossibile aggiornare la password.')}}
async function logoutUser(){if(!confirm('Vuoi uscire dal tuo account?'))return;await db.auth.signOut();showLogin()}

function renderPhotoPreview(){const c=document.getElementById('photoPreview');if(!c)return;const existing=Array.from(c.querySelectorAll('[data-existing-photo]')).map(x=>x.outerHTML).join('');c.innerHTML=existing+selectedPhotos.map((p,i)=>`<div class="photo-item"><img src="${esc(p.preview)}" alt="Nuova foto"><button class="remove-photo" type="button" onclick="removeSelectedPhoto(${i})">×</button></div>`).join('')}
function removeSelectedPhoto(i){const p=selectedPhotos[i];if(p?.preview)URL.revokeObjectURL(p.preview);selectedPhotos.splice(i,1);renderPhotoPreview()}
function clearSelectedPhotos(){selectedPhotos.forEach(p=>p.preview&&URL.revokeObjectURL(p.preview));selectedPhotos=[]}
async function uploadPhotos(id){const out=[];for(let i=0;i<selectedPhotos.length;i++){const f=selectedPhotos[i].file,ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg',path=`${currentUser.id}/${id}/${Date.now()}_${i}_${Math.random().toString(36).slice(2,8)}.${ext}`;const {error}=await db.storage.from(PHOTO_BUCKET).upload(path,f,{cacheControl:'3600',upsert:false,contentType:f.type});if(error)throw new Error('Errore caricamento foto: '+error.message);out.push(path)}return out}
async function createBike(){const brand=document.getElementById('bikeBrand').value.trim(),model=document.getElementById('bikeModel').value.trim(),year=document.getElementById('bikeYear').value.trim(),color=document.getElementById('bikeColor').value.trim(),frame=document.getElementById('bikeFrame').value.trim(),b=document.getElementById('createBikeButton');if(!brand||!model||!frame)return alert('Inserisci marca, modello e numero telaio.');b.disabled=true;b.textContent='IMMATRICOLAZIONE...';const id=generateId();try{const photos=await uploadPhotos(id);const {data:rows,error}=await db.from('bikes').insert([{user_id:currentUser.id,biicode_id:id,brand,model,year,color,frame_number:frame,stolen:false,status:'active',photos}]).select();if(error)throw error;data.unshift(normalizeBike(rows?.[0]||{biicode_id:id,user_id:currentUser.id,brand,model,year,color,frame_number:frame,stolen:false,status:'active',photos}));saveLocal();closeM();detail(js(id))}catch(e){alert('Errore durante l’immatricolazione.\n\n'+e.message);b.disabled=false;b.textContent='IMMATRICOLA BICI'}}
function renderExistingPhotos(photos){const c=document.getElementById('photoPreview');if(c)c.innerHTML=(photos||[]).map(p=>`<div class="photo-item" data-existing-photo="${esc(p)}"><img src="${esc(photoUrl(p))}" alt="Foto bicicletta"><button class="remove-photo" type="button" onclick="removeExistingPhoto(this,'${js(p)}')">×</button></div>`).join('')}
function removeExistingPhoto(btn,encoded){const p=unjs(encoded);if(!photosToDelete.includes(p))photosToDelete.push(p);btn.closest('.photo-item')?.remove()}
function editBike(encoded){const id=unjs(encoded),b=data.find(x=>x.id===id);if(!b)return alert('Bici non trovata.');selectedPhotos=[];photosToDelete=[];openM(`<button class="back" onclick="detail('${js(id)}')">‹ Annulla modifiche</button><h1>Modifica bici</h1>${formFields(b)}<div class="form-actions"><button id="saveBikeButton" class="primary" onclick="saveBike('${js(id)}')">SALVA MODIFICHE</button></div>`);renderExistingPhotos(b.photos||[])}
async function saveBike(encoded){const id=unjs(encoded),old=data.find(x=>x.id===id),brand=document.getElementById('bikeBrand').value.trim(),model=document.getElementById('bikeModel').value.trim(),year=document.getElementById('bikeYear').value.trim(),color=document.getElementById('bikeColor').value.trim(),frame=document.getElementById('bikeFrame').value.trim(),btn=document.getElementById('saveBikeButton');if(!old)return;if(!brand||!model||!frame)return alert('Inserisci marca, modello e numero telaio.');btn.disabled=true;btn.textContent='SALVATAGGIO...';try{const remaining=(old.photos||[]).filter(p=>!photosToDelete.includes(p)),newPhotos=await uploadPhotos(id),finalPhotos=[...remaining,...newPhotos];if(finalPhotos.length>MAX_PHOTOS)throw new Error(`Puoi avere al massimo ${MAX_PHOTOS} fotografie.`);const {data:rows,error}=await db.from('bikes').update({brand,model,year,color,frame_number:frame,photos:finalPhotos}).eq('biicode_id',id).eq('user_id',currentUser.id).select();if(error)throw error;if(!rows?.length)throw new Error('Nessuna bici è stata aggiornata.');if(photosToDelete.length)await db.storage.from(PHOTO_BUCKET).remove(photosToDelete);data[data.findIndex(x=>x.id===id)]=normalizeBike(rows[0]);saveLocal();photosToDelete=[];closeM();detail(js(id))}catch(e){alert('Impossibile salvare le modifiche.\n\n'+e.message);btn.disabled=false;btn.textContent='SALVA MODIFICHE'}}
function bikePhotos(photos){if(!photos?.length)return'';return`<div class="muted" style="margin-top:18px">FOTOGRAFIE DELLA BICI</div><div class="detail-photos">${photos.map(p=>{const u=photoUrl(p);return`<div class="detail-photo" onclick="openPhotoViewer('${js(u)}')"><img src="${esc(u)}" alt="Foto bicicletta"></div>`}).join('')}</div>`}
function detail(encoded){const id=unjs(encoded),b=data.find(x=>x.id===id);if(!b)return alert('Bici non trovata.');const stolen=b.stolen===true;openM(`<button class="back" onclick="closeM();home()">‹ Indietro</button><h1>${esc(b.brand)} ${esc(b.model)}</h1><div class="card"><div class="muted">BIICODE ID</div><div class="name">${esc(b.id)}</div><div id="qr" class="qr"></div><div class="tools"><button class="tool" onclick="copyText('${js(b.id)}')">COPIA ID</button><button class="tool" onclick="shareBike('${js(b.id)}')">CONDIVIDI</button></div><div class="muted" style="margin-top:18px">NUMERO TELAIO</div><div class="name">${esc(b.frame_number||'-')}</div><br><div class="muted">ANNO / COLORE</div><div class="name">${esc(b.year||'-')} · ${esc(b.color||'-')}</div>${bikePhotos(b.photos)}<div class="alert ${stolen?'stolen':''}">${stolen?'🔴 QUESTA BICI RISULTA RUBATA':'🟢 QUESTA BICI RISULTA ATTIVA'}</div><button class="primary" onclick="editBike('${js(b.id)}')">✏️ MODIFICA BICI</button><button class="primary ${stolen?'success':'danger'}" style="margin-top:10px" onclick="toggleStolen('${js(b.id)}')">${stolen?'SEGNALA COME RECUPERATA':'SEGNALA FURTO'}</button><button class="secondary danger-outline" style="margin-top:10px" onclick="deleteBike('${js(b.id)}')">ELIMINA BICI</button></div>`);const q=document.getElementById('qr');if(q&&typeof QRCode!=='undefined')new QRCode(q,{text:publicUrl(b.id),width:190,height:190})}
function publicUrl(id){return location.origin+location.pathname+'?bike='+encodeURIComponent(id)}
async function copyText(encoded){const t=unjs(encoded);try{await navigator.clipboard.writeText(t);alert('BIICODE copiato.')}catch(e){alert('BIICODE: '+t)}}
async function shareBike(encoded){const id=unjs(encoded),url=publicUrl(id);if(navigator.share){try{await navigator.share({title:'BIICODE',text:'Verifica questa bici su BIICODE',url})}catch(e){}}else{try{await navigator.clipboard.writeText(url);alert('Link di verifica copiato.')}catch(e){alert(url)}}}
async function toggleStolen(encoded){const id=unjs(encoded),b=data.find(x=>x.id===id);if(!b)return;const next=!b.stolen;if(!confirm(next?'Confermi di voler segnalare questa bici come RUBATA?':'Confermi che la bici è stata RECUPERATA?'))return;try{const {data:rows,error}=await db.from('bikes').update({stolen:next,status:next?'stolen':'active'}).eq('biicode_id',id).eq('user_id',currentUser.id).select();if(error)throw error;if(!rows?.length)throw new Error('Nessuna bici aggiornata.');data[data.findIndex(x=>x.id===id)]=normalizeBike(rows[0]);saveLocal();detail(js(id))}catch(e){alert('Impossibile aggiornare lo stato.\n\n'+e.message)}}
async function deleteBike(encoded){const id=unjs(encoded),b=data.find(x=>x.id===id);if(!b)return;if(!confirm(`Eliminare definitivamente ${b.brand} ${b.model}?`))return;try{if(b.photos?.length)await db.storage.from(PHOTO_BUCKET).remove(b.photos);const {error}=await db.from('bikes').delete().eq('biicode_id',id).eq('user_id',currentUser.id);if(error)throw error;data=data.filter(x=>x.id!==id);saveLocal();closeM();home()}catch(e){alert('Impossibile eliminare la bici.\n\n'+e.message)}}
function quick(){if(!data.length)return alert('Non hai ancora registrato nessuna bici.');detail(js(data[0].id))}
function openPhotoViewer(encoded){document.getElementById('viewerImage').src=unjs(encoded);document.getElementById('photoViewer').classList.add('active')}
function closePhotoViewer(){document.getElementById('photoViewer').classList.remove('active');document.getElementById('viewerImage').src=''}
function scan(){openM(`<button class="back" onclick="closeM();home()">‹ Annulla</button><h1>Scansiona BIICODE</h1><div class="scanner-box"><video id="scannerVideo" autoplay playsinline muted></video><div class="scanner-frame"></div></div><div id="scanMessage" class="card center"><div class="muted">Inquadra il QR della bici.</div></div><button class="secondary" onclick="stopScanner();manualScan()">INSERISCI CODICE MANUALMENTE</button>`);startScanner()}
async function startScanner(){const video=document.getElementById('scannerVideo');if(!video)return;try{if(!('BarcodeDetector' in window))throw new Error('BarcodeDetector non disponibile');if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera non disponibile');scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=scannerStream;const detector=new BarcodeDetector({formats:['qr_code']});const loop=async()=>{if(!video.isConnected)return;if(video.readyState>=2){try{const codes=await detector.detect(video);if(codes.length){const raw=codes[0].rawValue||'';stopScanner();handleScan(raw);return}}catch(e){}}scannerTimer=setTimeout(loop,250)};loop()}catch(e){const m=document.getElementById('scanMessage');if(m)m.innerHTML='<b>Scanner automatico non disponibile.</b><br><span class="muted">Puoi inserire il codice manualmente.</span>'}}
function stopScanner(){if(scannerTimer)clearTimeout(scannerTimer);scannerTimer=null;if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}const v=document.getElementById('scannerVideo');if(v)v.srcObject=null}
function manualScan(){const code=prompt('Inserisci il BIICODE, ad esempio IT-ABCDEFGH');if(code)handleScan(code.trim())}
function handleScan(raw){let id='';try{id=new URL(raw).searchParams.get('bike')||''}catch(e){}if(!id)id=String(raw).replace(/^BIICODE[:\s-]*/i,'').trim();if(!id)return alert('Codice non riconosciuto.');openPublicResult(id)}
async function openPublicResult(id){openM(`<button class="back" onclick="closeM();home()">‹ Indietro</button><h1>Verifica BIICODE</h1><div id="publicResult" class="card"><div class="muted">VERIFICA IN CORSO...</div></div>`);const b=await loadPublicBike(id),box=document.getElementById('publicResult');if(!box)return;if(!b)box.innerHTML='<div class="name">Bici non trovata</div><div class="muted">Questo BIICODE non è associato a una bici registrata.</div>';else box.innerHTML=publicHtml(b)}
async function loadPublicBike(id){try{const {data:rows,error}=await db.from('bikes').select('*').eq('biicode_id',id).limit(1);if(error)throw error;return rows?.length?normalizeBike(rows[0]):null}catch(e){console.error(e);return null}}
function publicHtml(b){const stolen=b.stolen===true;return`<div class="muted">BIICODE</div><h1 style="margin-top:7px">${esc(b.brand)} ${esc(b.model)}</h1><div class="muted">ID</div><div class="name">${esc(b.id)}</div><br><div class="muted">ANNO</div><div class="name">${esc(b.year||'-')}</div><br><div class="muted">COLORE</div><div class="name">${esc(b.color||'-')}</div>${bikePhotos(b.photos)}<div class="alert ${stolen?'stolen':''}">${stolen?'🔴 ATTENZIONE: QUESTA BICI RISULTA RUBATA':'🟢 QUESTA BICI RISULTA ATTIVA'}</div><div class="small center">Il numero di telaio non viene mostrato nella verifica pubblica.</div>`}
async function loadData(){if(!currentUser){data=[];return}try{const {data:rows,error}=await db.from('bikes').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false});if(error)throw error;data=Array.isArray(rows)?rows.map(normalizeBike):[];saveLocal()}catch(e){console.error(e);loadLocal()}}
async function startPrivateApp(){if(booting)return;booting=true;try{currentUser=currentUser||((await db.auth.getUser()).data.user);await loadData();home()}finally{booting=false}}
async function publicMode(id){header.style.display='none';navigation.style.display='none';document.querySelector('main').style.padding='0 20px';app.innerHTML=`<div class="login-screen"><div style="width:100%;max-width:520px"><div class="login-brand">BIICODE</div><div class="login-tag">VERIFICA BICICLETTA</div><div id="publicRoot" class="card">Verifica in corso...</div></div></div>`;const b=await loadPublicBike(id),r=document.getElementById('publicRoot');if(r)r.innerHTML=b?publicHtml(b):'<div class="name">Bici non trovata</div><div class="muted">Questo BIICODE non è associato a una bici registrata.</div>'}
async function startApp(){const p=new URLSearchParams(location.search),bike=p.get('bike');if(bike){await publicMode(bike);return}const {data:s}=await db.auth.getSession();if(s.session?.user){currentUser=s.session.user;if(location.hash.includes('type=recovery')){showResetPassword();return}await startPrivateApp()}else showLogin()}
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){currentUser=null;data=[];showLogin()}else if(event==='PASSWORD_RECOVERY'){showResetPassword()}else if(event==='SIGNED_IN'&&session?.user&&!booting){currentUser=session.user;startPrivateApp()}});
window.addEventListener('beforeunload',stopScanner);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
startApp();
</script>
</body>
</html>
