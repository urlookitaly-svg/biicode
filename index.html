<!doctype html>
<html lang="it">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#0B1320"
>

<title>BIICODE</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  margin:0;
  padding:0;
  background:#0B1320;
}

body{
  margin:0;
  padding:0;

  min-height:100vh;
  min-height:100dvh;

  background:#0B1320;
  color:#FFFFFF;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* =========================================================
   APP PRINCIPALE
========================================================= */

main{
  width:100%;
  max-width:480px;

  margin:0 auto;

  padding:
    20px
    20px
    calc(110px + env(safe-area-inset-bottom));

  min-height:100vh;
  min-height:100dvh;
}


/* =========================================================
   HEADER
========================================================= */

.head{
  display:flex;
  align-items:center;
  gap:12px;

  margin-bottom:30px;
}

.logo{
  width:48px;
  height:48px;

  flex:none;

  border-radius:12px;

  background:#07101D;

  display:grid;
  place-items:center;

  font-size:25px;
  font-weight:900;
}

.logo b{
  color:#1565FF;
}

.brand{
  font-size:21px;
  font-weight:900;
}

.tag{
  margin-top:2px;

  font-size:8px;

  color:#9AA7B8;

  letter-spacing:1px;
}


/* =========================================================
   TESTI
========================================================= */

h1{
  margin:10px 0 18px;

  font-size:28px;
  line-height:1.15;

  font-weight:900;
}

.muted{
  color:#94A1B3;
  font-size:13px;
}


/* =========================================================
   CARD
========================================================= */

.card{
  background:#111D2D;

  border:1px solid #203149;

  border-radius:18px;

  padding:16px;

  margin-bottom:14px;
}

.bike{
  display:flex;
  gap:15px;
  align-items:center;

  cursor:pointer;
}

.pic{
  width:90px;
  height:80px;

  flex:none;

  background:#0A1523;

  border-radius:14px;

  display:grid;
  place-items:center;

  font-size:42px;

  overflow:hidden;
}

.pic img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.name{
  font-size:17px;
  font-weight:800;
}

.id{
  margin-top:5px;

  font-size:12px;

  color:#94A1B3;
}

.status{
  display:inline-block;

  padding:4px 9px;

  border-radius:10px;

  margin-top:7px;

  font-size:10px;
  font-weight:800;
}


/* =========================================================
   GRIGLIA HOME
========================================================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.action{
  width:100%;

  min-height:110px;

  padding:18px;

  background:#111D2D;
  color:#FFFFFF;

  border:1px solid #203149;

  border-radius:16px;

  text-align:left;

  font-size:14px;

  cursor:pointer;
}

.action:active{
  transform:scale(.98);
}

.ico{
  display:block;

  margin-bottom:12px;

  font-size:27px;

  color:#1565FF;
}


/* =========================================================
   BUTTON
========================================================= */

button{
  font:inherit;
  cursor:pointer;

  -webkit-appearance:none;
  appearance:none;
}

.primary{
  display:block;

  width:100%;

  min-height:58px;

  padding:16px;

  border:0;

  border-radius:14px;

  background:#1565FF;

  color:#FFFFFF;

  font-size:16px;
  font-weight:900;

  text-align:center;

  cursor:pointer;

  box-shadow:
    0 6px 20px rgba(21,101,255,.20);
}

.primary:active{
  transform:scale(.98);
}

.primary:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.secondary{
  display:block;

  width:100%;

  min-height:54px;

  padding:15px;

  margin-top:10px;

  border:1px solid #2A3B52;

  border-radius:14px;

  background:#111D2D;

  color:#FFFFFF;

  font-size:15px;
  font-weight:800;

  text-align:center;
}

.edit-button{
  margin-bottom:10px;

  background:#1565FF;
}


/* =========================================================
   INPUT
========================================================= */

label{
  display:block;

  margin-top:4px;

  font-size:13px;
  font-weight:600;

  color:#AAB5C4;
}

input{
  display:block;

  width:100%;

  min-height:58px;

  padding:15px;

  margin:
    7px
    0
    20px;

  background:#111D2D;

  border:1px solid #2A3B52;

  border-radius:14px;

  color:#FFFFFF;

  font-family:inherit;

  font-size:17px;

  outline:none;

  -webkit-appearance:none;
  appearance:none;
}

input::placeholder{
  color:#7F8B9A;
}

input:focus{
  border-color:#1565FF;

  box-shadow:
    0 0 0 2px rgba(21,101,255,.20);
}


/* =========================================================
   FOTO
========================================================= */

.photo-box{
  margin-top:8px;
  margin-bottom:20px;
}

.photo-info{
  margin-bottom:12px;

  color:#94A1B3;

  font-size:12px;
}

.photo-add{
  width:100%;

  min-height:58px;

  padding:15px;

  background:#111D2D;

  border:2px dashed #2A3B52;

  border-radius:14px;

  color:#FFFFFF;

  font-weight:800;

  text-align:center;
}

.photo-add:active{
  transform:scale(.98);
}

.photo-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-top:12px;
}

.photo-item{
  position:relative;

  aspect-ratio:1;

  overflow:hidden;

  border-radius:12px;

  background:#07101D;

  border:1px solid #203149;
}

.photo-item img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.remove-photo{
  position:absolute;

  top:6px;
  right:6px;

  width:30px;
  height:30px;

  padding:0;

  border:0;

  border-radius:50%;

  background:#EF4444;

  color:#FFFFFF;

  font-size:20px;
  font-weight:900;

  line-height:30px;

  text-align:center;
}

.detail-photos{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

  margin-top:15px;
}

.detail-photo{
  aspect-ratio:1;

  overflow:hidden;

  border-radius:14px;

  background:#07101D;
}

.detail-photo img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  cursor:pointer;
}


/* =========================================================
   NAVIGAZIONE
========================================================= */

.nav{
  position:fixed;

  z-index:100;

  left:0;
  right:0;
  bottom:0;

  height:
    calc(82px + env(safe-area-inset-bottom));

  padding-bottom:
    env(safe-area-inset-bottom);

  background:#0E1A2A;

  border-top:1px solid #203149;

  display:flex;

  justify-content:space-around;

  align-items:center;
}

.nav button{
  width:20%;

  height:65px;

  padding:0;

  background:none;

  border:0;

  color:#9AA4B2;

  font-size:12px;
  font-weight:600;

  text-align:center;
}

.nav button:active{
  color:#FFFFFF;
}

.plus{
  width:58px!important;
  height:58px!important;

  flex:none;

  margin-top:-28px;

  border-radius:50%!important;

  background:#1565FF!important;

  color:#FFFFFF!important;

  font-size:32px!important;
  font-weight:400!important;

  box-shadow:
    0 8px 25px rgba(21,101,255,.30);
}


/* =========================================================
   NASCONDI NAV DURANTE MODULO
========================================================= */

body.form-open .nav{
  display:none;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;

  z-index:500;

  inset:0;

  width:100%;
  height:100dvh;

  background:#0B1320;

  overflow-y:auto;
  overflow-x:hidden;

  -webkit-overflow-scrolling:touch;

  padding:
    calc(20px + env(safe-area-inset-top))
    20px
    calc(50px + env(safe-area-inset-bottom));

  display:none;
}

.modal.active{
  display:block;
}

.modal-content{
  width:100%;
  max-width:480px;

  margin:0 auto;

  padding-bottom:40px;
}


/* =========================================================
   BACK
========================================================= */

.back{
  display:block;

  padding:8px 0 20px;

  background:none;

  border:0;

  color:#1565FF;

  font-size:18px;
  font-weight:800;

  text-align:left;
}


/* =========================================================
   FORM ACTIONS
========================================================= */

.form-actions{
  width:100%;

  margin-top:10px;

  padding-top:5px;

  padding-bottom:30px;
}


/* =========================================================
   QR
========================================================= */

.qr{
  width:max-content;

  margin:20px auto;

  padding:12px;

  background:#FFFFFF;

  border-radius:12px;
}


/* =========================================================
   ALERT
========================================================= */

.alert{
  padding:14px;

  margin:15px 0;

  border-radius:12px;

  background:#10271C;

  color:#A9EFC4;

  font-size:14px;
  font-weight:700;
}

.stolen{
  background:#29151B;
  color:#FFB4BC;
}


/* =========================================================
   FOTO GRANDE
========================================================= */

.photo-viewer{
  position:fixed;

  z-index:2000;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.92);
}

.photo-viewer.active{
  display:flex;
}

.photo-viewer img{
  max-width:100%;
  max-height:85dvh;

  object-fit:contain;

  border-radius:12px;
}

.close-viewer{
  position:absolute;

  top:
    calc(15px + env(safe-area-inset-top));

  right:20px;

  width:44px;
  height:44px;

  border:0;

  border-radius:50%;

  background:#FFFFFF;

  color:#0B1320;

  font-size:25px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

  main{
    padding-left:15px;
    padding-right:15px;
  }

  .modal{
    padding-left:15px;
    padding-right:15px;
  }

  h1{
    font-size:26px;
  }

  .grid{
    gap:8px;
  }

  .action{
    padding:15px;
  }

}


/* =========================================================
   OVERFLOW
========================================================= */

img,
svg,
canvas{
  max-width:100%;
}

</style>

</head>


<body>


<main>

  <div class="head">

    <div class="logo">
      b<b>◯</b>
    </div>

    <div>

      <div class="brand">
        BIICODE
      </div>

      <div class="tag">
        LA TUA BICI. UN'IDENTITÀ UNICA.
      </div>

    </div>

  </div>

  <div id="app"></div>

</main>


<div id="navigation" class="nav">

  <button type="button" onclick="home()">
    ⌂
    <br>
    Home
  </button>

  <button type="button" onclick="bikes()">
    🚲
    <br>
    Bici
  </button>

  <button
    type="button"
    class="plus"
    onclick="add()"
  >
    +
  </button>

  <button type="button" onclick="activity()">
    ▤
    <br>
    Attività
  </button>

  <button type="button" onclick="profile()">
    ○
    <br>
    Profilo
  </button>

</div>


<div id="modal" class="modal"></div>


<div
  id="photoViewer"
  class="photo-viewer"
  onclick="closePhotoViewer()"
>

  <button
    type="button"
    class="close-viewer"
    onclick="event.stopPropagation(); closePhotoViewer();"
  >
    ×
  </button>

  <img
    id="viewerImage"
    src=""
    alt="Foto bicicletta"
    onclick="event.stopPropagation()"
  >

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const { createClient } = supabase;

const SUPABASE_URL =
  "https://swzkrwdqfgetwcmaiqty.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_inpwNp-Uqe-X4BeTl54uiQ_1ARA1HNb";

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   CONFIGURAZIONE FOTO
========================================================= */

const PHOTO_BUCKET = "bike-photos";

const MAX_PHOTOS = 5;


/* =========================================================
   DATI
========================================================= */

let data = [];

/*
  Foto nuove selezionate
  durante creazione o modifica.
*/
let selectedPhotos = [];

/*
  Foto già esistenti che
  devono essere eliminate.
*/
let photosToDelete = [];


/* =========================================================
   ELEMENTI
========================================================= */

const app =
  document.getElementById("app");

const modal =
  document.getElementById("modal");

const navigation =
  document.getElementById("navigation");


/* =========================================================
   CACHE LOCALE
========================================================= */

function save(){

  localStorage.setItem(
    "biicode",
    JSON.stringify(data)
  );

}


function loadLocal(){

  try{

    const local =
      JSON.parse(
        localStorage.getItem("biicode") || "[]"
      );

    if(Array.isArray(local)){

      data = local;

    }

  }catch(error){

    console.warn(
      "Errore cache locale:",
      error
    );

    data = [];

  }

}


/* =========================================================
   GENERA BIICODE ID
========================================================= */

function generateId(){

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "IT-";

  for(let i = 0; i < 8; i++){

    result +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }

  return result;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   NORMALIZZA FOTO
========================================================= */

function normalizePhotos(value){

  if(Array.isArray(value)){

    return value.filter(Boolean);

  }

  return [];

}


/* =========================================================
   NORMALIZZA BICI
========================================================= */

function normalizeBike(row){

  return {

    id:
      row.biicode_id ||
      row.id ||
      "",

    brand:
      row.brand ||
      "",

    model:
      row.model ||
      "",

    year:
      row.year ||
      "",

    color:
      row.color ||
      "",

    frame_number:
      row.frame_number ||
      "",

    stolen:
      row.stolen === true,

    status:
      row.status ||
      "active",

    photos:
      normalizePhotos(
        row.photos
      )

  };

}


/* =========================================================
   URL FOTO SUPABASE
========================================================= */

function getPhotoUrl(path){

  if(!path){

    return "";

  }

  if(
    String(path).startsWith("http://") ||
    String(path).startsWith("https://")
  ){

    return path;

  }

  const {
    data:publicData
  } = db
    .storage
    .from(PHOTO_BUCKET)
    .getPublicUrl(path);

  return publicData.publicUrl;

}


/* =========================================================
   FOTO COPERTINA
========================================================= */

function bikeCover(b){

  if(
    b.photos &&
    b.photos.length
  ){

    const url =
      getPhotoUrl(
        b.photos[0]
      );

    return `

      <img
        src="${escapeHTML(url)}"
        alt="Foto bicicletta"
      >

    `;

  }

  return "🚲";

}


/* =========================================================
   CARD BICI
========================================================= */

function card(b){

  const stolen =
    b.stolen === true;

  return `

    <div
      class="card bike"
      onclick="detail('${escapeHTML(b.id)}')"
    >

      <div class="pic">

        ${bikeCover(b)}

      </div>

      <div>

        <div class="name">

          ${escapeHTML(b.brand)}
          ${escapeHTML(b.model)}

        </div>

        <div class="id">

          ${escapeHTML(b.id)}

        </div>

        <span
          class="status"
          style="
            background:
            ${stolen
              ? "#EF4444"
              : "#22C55E"};
          "
        >

          ${stolen
            ? "RUBATA"
            : "ATTIVA"}

        </span>

      </div>

    </div>

  `;

}


/* =========================================================
   HOME
========================================================= */

function home(){

  closeM();

  navigation.style.display = "flex";

  app.innerHTML = `

    <div class="muted">
      Ciao Claudio 👋
    </div>

    <h1>
      Le mie bici
    </h1>

    ${
      data.length
      ? data.map(card).join("")
      : `

        <div class="card">

          <div class="name">
            Nessuna bici registrata
          </div>

          <br>

          <div class="muted">
            Registra la tua prima bici.
          </div>

        </div>

      `
    }

    <div class="grid">

      <button
        type="button"
        class="action"
        onclick="scan()"
      >

        <span class="ico">⌗</span>

        <b>Scansiona QR</b>

        <br>

        <span class="muted">
          Verifica una bici
        </span>

      </button>

      <button
        type="button"
        class="action"
        onclick="add()"
      >

        <span class="ico">+</span>

        <b>Immatricola</b>

        <br>

        <span class="muted">
          Registra una bici
        </span>

      </button>

      <button
        type="button"
        class="action"
        onclick="quick()"
      >

        <span class="ico">⚠</span>

        <b>Segnala furto</b>

        <br>

        <span class="muted">
          Proteggi la tua bici
        </span>

      </button>

      <button
        type="button"
        class="action"
        onclick="alert('Funzione trasferimento in arrivo')"
      >

        <span class="ico">↔</span>

        <b>Trasferisci</b>

        <br>

        <span class="muted">
          Proprietà
        </span>

      </button>

    </div>

  `;

}


/* =========================================================
   BICI
========================================================= */

function bikes(){

  closeM();

  navigation.style.display = "flex";

  app.innerHTML = `

    <h1>
      Le mie bici
    </h1>

    ${
      data.length
      ? data.map(card).join("")
      : `

        <div class="card">

          <div class="name">
            Nessuna bici
          </div>

        </div>

      `
    }

    <button
      type="button"
      class="primary"
      onclick="add()"
    >
      + IMMATRICOLA UNA BICI
    </button>

  `;

}


/* =========================================================
   APRI MODULO
========================================================= */

function openForm(content){

  document.body.classList.add(
    "form-open"
  );

  modal.classList.add(
    "active"
  );

  modal.innerHTML = `

    <div class="modal-content">

      ${content}

    </div>

  `;

  modal.scrollTop = 0;

}


/* =========================================================
   CHIUDI MODULO
========================================================= */

function closeM(){

  document.body.classList.remove(
    "form-open"
  );

  modal.classList.remove(
    "active"
  );

  modal.innerHTML = "";

}


/* =========================================================
   IMMATRICOLA NUOVA BICI
========================================================= */

function add(){

  selectedPhotos = [];
  photosToDelete = [];

  openForm(`

    <button
      type="button"
      class="back"
      onclick="cancelForm()"
    >
      ‹ Annulla
    </button>

    <h1>
      Immatricola la tua bici
    </h1>

    ${bikeFormFields({
      brand:"",
      model:"",
      year:"",
      color:"",
      frame_number:"",
      photos:[]
    })}

    <div class="form-actions">

      <button
        type="button"
        id="createBikeButton"
        class="primary"
        onclick="createBike()"
      >
        IMMATRICOLA BICI
      </button>

    </div>

  `);

}


/* =========================================================
   CAMPI FORM BICI
========================================================= */

function bikeFormFields(b){

  return `

    <label for="bikeBrand">
      Marca
    </label>

    <input
      id="bikeBrand"
      type="text"
      autocomplete="off"
      placeholder="Es. Trek"
      value="${escapeHTML(b.brand || "")}"
    >

    <label for="bikeModel">
      Modello
    </label>

    <input
      id="bikeModel"
      type="text"
      autocomplete="off"
      placeholder="Es. Fuel EX 8"
      value="${escapeHTML(b.model || "")}"
    >

    <label for="bikeYear">
      Anno
    </label>

    <input
      id="bikeYear"
      type="number"
      inputmode="numeric"
      placeholder="Es. 2022"
      value="${escapeHTML(b.year || "")}"
    >

    <label for="bikeColor">
      Colore
    </label>

    <input
      id="bikeColor"
      type="text"
      autocomplete="off"
      placeholder="Es. Nero"
      value="${escapeHTML(b.color || "")}"
    >

    <label for="bikeFrame">
      Numero telaio
    </label>

    <input
      id="bikeFrame"
      type="text"
      autocomplete="off"
      placeholder="Numero telaio"
      value="${escapeHTML(b.frame_number || "")}"
    >

    <label>
      Fotografie della bici
    </label>

    <div class="photo-box">

      <div class="photo-info">
        Puoi avere fino a ${MAX_PHOTOS} fotografie.
      </div>

      <input
        id="bikePhotos"
        type="file"
        accept="image/*"
        multiple
        capture="environment"
        style="display:none"
        onchange="handlePhotoSelection(event)"
      >

      <button
        type="button"
        class="photo-add"
        onclick="document.getElementById('bikePhotos').click()"
      >
        📷 AGGIUNGI FOTO
      </button>

/* =========================================================
   SELEZIONE NUOVE FOTO
========================================================= */

function handlePhotoSelection(event){

  const files =
    Array.from(event.target.files || []);

  if(!files.length){

    return;

  }

  const existingPhotos =
    getCurrentExistingPhotosCount();

  const availableSlots =
    MAX_PHOTOS -
    existingPhotos -
    selectedPhotos.length;

  if(availableSlots <= 0){

    alert(
      `Puoi avere al massimo ${MAX_PHOTOS} fotografie.`
    );

    event.target.value = "";

    return;

  }

  const filesToAdd =
    files.slice(0, availableSlots);

  if(files.length > availableSlots){

    alert(
      `Puoi aggiungere solo ${availableSlots} fotografie.`
    );

  }

  filesToAdd.forEach(file => {

    if(!file.type.startsWith("image/")){

      return;

    }

    const preview =
      URL.createObjectURL(file);

    selectedPhotos.push({

      file:file,
      preview:preview

    });

  });

  event.target.value = "";

  renderPhotoPreview();

}


/* =========================================================
   CONTA FOTO ESISTENTI NEL FORM
========================================================= */

function getCurrentExistingPhotosCount(){

  const container =
    document.getElementById("photoPreview");

  if(!container){

    return 0;

  }

  return container.querySelectorAll(
    "[data-existing-photo]"
  ).length;

}


/* =========================================================
   RENDER NUOVE FOTO
========================================================= */

function renderPhotoPreview(){

  const container =
    document.getElementById("photoPreview");

  if(!container){

    return;

  }

  const existingHtml =
    container.querySelectorAll(
      "[data-existing-photo]"
    );

  let existingContent = "";

  existingHtml.forEach(item => {

    existingContent += item.outerHTML;

  });

  const newContent =
    selectedPhotos.map(
      (photo,index) => `

        <div class="photo-item">

          <img
            src="${escapeHTML(photo.preview)}"
            alt="Nuova foto ${index + 1}"
          >

          <button
            type="button"
            class="remove-photo"
            onclick="removeSelectedPhoto(${index})"
          >
            ×
          </button>

        </div>

      `
    ).join("");

  container.innerHTML =
    existingContent +
    newContent;

}


/* =========================================================
   ELIMINA NUOVA FOTO
========================================================= */

function removeSelectedPhoto(index){

  const photo =
    selectedPhotos[index];

  if(photo && photo.preview){

    URL.revokeObjectURL(
      photo.preview
    );

  }

  selectedPhotos.splice(index, 1);

  renderPhotoPreview();

}

/* =========================================================
   CARICA FOTO SU SUPABASE
========================================================= */

async function uploadSelectedPhotos(bikeId){

  const uploaded = [];

  for(let i = 0; i < selectedPhotos.length; i++){

    const photo =
      selectedPhotos[i];

    const file =
      photo.file;

    let extension =
      file.name
        .split(".")
        .pop()
        ?.toLowerCase()
      || "jpg";

    extension =
      extension.replace(
        /[^a-z0-9]/gi,
        ""
      );

    const filePath =
      `${bikeId}/${Date.now()}_${i}_${Math.random().toString(36).slice(2,8)}.${extension}`;

    const {
      error:uploadError
    } = await db
      .storage
      .from(PHOTO_BUCKET)
      .upload(
        filePath,
        file,
        {

          cacheControl:"3600",
          upsert:false,
          contentType:file.type

        }
      );

    if(uploadError){

      throw new Error(
        "Errore caricamento foto: " +
        uploadError.message
      );

    }

    uploaded.push(filePath);

  }

  return uploaded;

}

/* =========================================================
   SALVA MODIFICHE BICI
========================================================= */

async function saveBikeChanges(idValue){

  const b =
    data.find(
      q => q.id === idValue
    );

  if(!b){

    alert("Bici non trovata.");

    return;

  }

  const brand =
    document.getElementById("bikeBrand")
      .value.trim();

  const model =
    document.getElementById("bikeModel")
      .value.trim();

  const year =
    document.getElementById("bikeYear")
      .value.trim();

  const color =
    document.getElementById("bikeColor")
      .value.trim();

  const frame =
    document.getElementById("bikeFrame")
      .value.trim();

  if(!brand || !model || !frame){

    alert(
      "Inserisci marca, modello e numero telaio."
    );

    return;

  }

  const button =
    document.getElementById(
      "saveBikeButton"
    );

  button.disabled = true;

  try{

    button.textContent =
      "PREPARAZIONE FOTO...";

    /*
      Foto che restano:
      tutte le originali meno
      quelle contrassegnate per eliminazione.
    */

    const remainingPhotos =
      (b.photos || []).filter(
        path => !photosToDelete.includes(path)
      );

    /*
      Carica le nuove foto.
    */

    let newPhotos = [];

    if(selectedPhotos.length){

      button.textContent =
        "CARICAMENTO NUOVE FOTO...";

      newPhotos =
        await uploadSelectedPhotos(
          idValue
        );

    }

    /*
      Unione foto vecchie + nuove.
    */

    const finalPhotos =
      [
        ...remainingPhotos,
        ...newPhotos
      ];

    if(finalPhotos.length > MAX_PHOTOS){

      throw new Error(
        `Puoi avere al massimo ${MAX_PHOTOS} fotografie.`
      );

    }

    button.textContent =
      "SALVATAGGIO MODIFICHE...";

    /*
      Aggiorna prima il record.
    */

    const {
      data:updatedRows,
      error
    } = await db
      .from("bikes")
      .update({

        brand:brand,
        model:model,
        year:year,
        color:color,
        frame_number:frame,
        photos:finalPhotos

      })
      .eq(
        "biicode_id",
        idValue
      )
      .select();

    if(error){

      throw new Error(
        error.message
      );

    }

    if(
      !updatedRows ||
      updatedRows.length === 0
    ){

      throw new Error(
        "Nessuna bici è stata aggiornata."
      );

    }

    /*
      Ora eliminiamo fisicamente
      le foto tolte da Supabase Storage.
    */

    if(photosToDelete.length){

      button.textContent =
        "ELIMINAZIONE FOTO...";

      const {
        error:removeError
      } = await db
        .storage
        .from(PHOTO_BUCKET)
        .remove(
          photosToDelete
        );

      if(removeError){

        console.warn(
          "Errore eliminazione file:",
          removeError
        );

      }

    }

    /*
      Aggiorna memoria locale.
    */

    const updatedBike =
      normalizeBike(
        updatedRows[0]
      );

    const index =
      data.findIndex(
        q => q.id === idValue
      );

    if(index !== -1){

      data[index] =
        updatedBike;

    }

    save();

    clearSelectedPhotos();

    photosToDelete = [];

    /*
      Torna al dettaglio.
    */

    detail(idValue);

  }catch(error){

    console.error(
      "Errore salvataggio:",
      error
    );

    alert(
      "Impossibile salvare le modifiche.\n\n" +
      error.message
    );

    button.disabled = false;

    button.textContent =
      "SALVA MODIFICHE";

  }

}

    if(

    const updatedBike =

      );

    if(index !== -1){
