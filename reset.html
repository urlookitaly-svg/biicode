<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1320"><title>BIICODE – Ripristino</title><style>html,body{margin:0;background:#0b1320;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:420px;background:#111d2d;border:1px solid #203149;border-radius:20px;padding:28px}.spinner{width:28px;height:28px;margin:18px auto;border:3px solid #30435d;border-top-color:#1565ff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#9aa8bb;line-height:1.5}</style></head><body><main><div class="box"><h2>Ripristino BIICODE</h2><div class="spinner"></div><p>Sto aggiornando l'app e rimuovendo la vecchia cache. Non chiudere questa pagina.</p></div></main><script>(async()=>{try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(regs.map(r=>r.unregister()));const keys=await caches?.keys?.()||[];await Promise.all(keys.map(k=>caches.delete(k)));}catch(e){}try{localStorage.removeItem('biicode_session')}catch(e){}setTimeout(()=>{location.href='./index.html?fresh='+Date.now()},700)})();</script></body></html>
