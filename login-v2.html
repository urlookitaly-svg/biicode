<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIICODE — Login diagnostico</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0B1320;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:100%;max-width:420px;background:#111D2D;border:1px solid #203149;border-radius:22px;padding:24px}.logo{text-align:center;font-size:32px;font-weight:950;margin-bottom:6px}.tag{text-align:center;color:#94A1B3;font-size:11px;letter-spacing:1px;margin-bottom:25px}label{display:block;color:#AAB5C4;font-size:13px;font-weight:700;margin:12px 0 7px}input{width:100%;height:54px;border:1px solid #2A3B52;border-radius:14px;background:#0B1320;color:#fff;padding:12px 14px;font-size:16px}button{width:100%;height:54px;margin-top:16px;border:0;border-radius:14px;background:#1565FF;color:#fff;font-weight:900;font-size:15px}.status{margin-top:18px;padding:14px;border-radius:12px;background:#0A1523;border:1px solid #203149;font-size:13px;line-height:1.45;white-space:pre-wrap}.ok{border-color:#22C55E}.err{border-color:#EF4444}.small{color:#7F8B9A;font-size:11px;margin-top:14px;line-height:1.4}
</style>
</head>
<body>
<div class="box">
<div class="logo">BIICODE</div><div class="tag">TEST AUTENTICAZIONE E API</div>
<label>Email</label><input id="email" type="email" autocomplete="email">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<button id="btn" onclick="testLogin()">VERIFICA LOGIN</button>
<div id="status" class="status">Inserisci le credenziali e avvia il test.</div>
<div class="small">Questa pagina non modifica dati e serve a distinguere un problema di credenziali da un problema Supabase/API Gateway/JWT.</div>
</div>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const URL="https://swzkrwdqfgetwcmaiqty.supabase.co";
const KEY="sb_publishable_inpwNp-Uqe-X4BeTl54uiQ_1ARA1HNb";
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const statusBox=document.getElementById('status'),btn=document.getElementById('btn');
function msg(t,c=''){statusBox.textContent=t;statusBox.className='status '+c}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function testLogin(){
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 if(!email||!password){msg('Inserisci email e password.','err');return}
 btn.disabled=true;btn.textContent='TEST IN CORSO...';
 try{
  msg('1/4 — Connessione Auth...');
  let result=await db.auth.signInWithPassword({email,password});
  if(result.error){
   const e=result.error;msg('LOGIN FALLITO\n\nHTTP: '+(e.status||'n/d')+'\nCodice: '+(e.code||'n/d')+'\nMessaggio: '+e.message,'err');return
  }
  if(!result.data.session){msg('Login senza sessione: risposta anomala di Auth.','err');return}
  msg('2/4 — Sessione ricevuta.\n\n3/4 — Verifica/refresh JWT...');
  let refresh=await db.auth.refreshSession();
  if(refresh.error){msg('LOGIN RIUSCITO, MA REFRESH JWT FALLITO\n\n'+refresh.error.message,'err');return}
  const session=refresh.data.session;
  msg('4/4 — Test API Database...');
  let q=await db.from('bikes').select('biicode_id').eq('user_id',session.user.id).limit(1);
  if(q.error){
    if(q.error.status===401 || /jwt|token|unauthor/i.test(q.error.message||'')){
      await sleep(1200);
      const r2=await db.auth.refreshSession();
      if(!r2.error){q=await db.from('bikes').select('biicode_id').eq('user_id',r2.data.session.user.id).limit(1)}
    }
  }
  if(q.error){msg('AUTHENTICAZIONE OK, API DATABASE KO\n\nHTTP: '+(q.error.status||'n/d')+'\nMessaggio: '+q.error.message+'\n\nQuesto indica un problema API/JWT/RLS, non di password.','err');return}
  msg('LOGIN E API OK ✓\n\nAccount: '+session.user.email+'\nJWT refresh: OK\nDatabase API: OK\n\nBIICODE può procedere normalmente.','ok');
 }catch(e){msg('ERRORE IMPREVISTO\n\n'+(e?.message||String(e)),'err')}finally{btn.disabled=false;btn.textContent='VERIFICA LOGIN'}
}
</script>
</body>
</html>
