name: Deploy BIICODE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare BIICODE V19
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'biicode-ui-v8\.js\?v=[0-9]+','biicode-ui-v8.js?v=19',s)
          s=re.sub(r"const V='biicode-v[0-9]+'", "const V='biicode-v19'", s)
          s=s.replace('./assets/biicode-logo-v2.svg?v=direct6','./assets/biicode-logo-v3.svg?v=direct19')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'biicode-ui-v8.js?v=19' index.html
          grep -q 'biicode-v19' index.html
          grep -q 'biicode-logo-v3.svg?v=direct19' index.html
          node --check biicode-ui-v8.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
