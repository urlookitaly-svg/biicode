name: Deploy BIICODE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Inject BIICODE visual refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          refresh = Path('visual-refresh.js').read_text(encoding='utf-8')
          marker = '</body>'
          if marker not in index:
              raise SystemExit('index.html: </body> marker not found')
          index = index.replace(marker, '<script>\n' + refresh + '\n</script>\n' + marker, 1)
          Path('index.html').write_text(index, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
