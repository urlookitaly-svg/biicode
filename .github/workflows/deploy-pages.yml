name: Deploy BIICODE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare BIICODE V15
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          for n in ('8','10','11','12','13','14'):
              s=s.replace(f'biicode-ui-v8.js?v={n}','biicode-ui-v8.js?v=15')
          for n in ('biicode-v7','biicode-v10','biicode-v11','biicode-v12','biicode-v13','biicode-v14'):
              s=s.replace(f"const V='{n}'", "const V='biicode-v15'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'biicode-ui-v8.js?v=15' index.html
          grep -q 'biicode-v15' index.html
          node --check biicode-ui-v8.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
