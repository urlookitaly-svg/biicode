name: Deploy BIICODE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build BIICODE UI directly into index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          css = r'''
          <style id="biicode-direct-v5">
          html,body{background:radial-gradient(circle at 50% -10%,#10284a 0,#0b1320 42%,#070d16 100%)!important}
          main{max-width:540px!important;padding:18px 18px 150px!important}
          .head{display:block!important;margin:0 0 18px!important;padding:0!important}
          .head-logo{display:block!important;width:min(390px,100%)!important;height:auto!important;max-height:118px!important;object-fit:contain!important;object-position:left center!important;margin:0 auto 4px 0!important}
          .login-logo{display:block!important;width:min(350px,100%)!important;height:auto!important;margin:0 auto 14px!important}
          .login .tag{display:none!important}
          h1{font-size:28px!important;letter-spacing:-.04em!important;margin:10px 0 14px!important}
          .card{background:linear-gradient(145deg,rgba(18,31,49,.96),rgba(12,23,37,.96))!important;border:1px solid #263c59!important;border-radius:22px!important;padding:18px!important;box-shadow:0 10px 28px rgba(0,0,0,.18)!important;margin-bottom:11px!important}
          .bike{min-height:96px!important}.bike strong{font-size:18px!important}.bike .id{margin-top:4px!important}
          .action{min-height:112px!important;border-radius:19px!important;background:linear-gradient(145deg,#14253a,#101c2c)!important;border:1px solid #29415f!important;padding:17px!important;box-shadow:0 8px 22px rgba(0,0,0,.15)!important}
          .action strong{font-size:16px!important;margin-bottom:7px!important}
          .quick-actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:11px!important;margin-top:11px!important}
          .quick-action{min-height:96px!important;border:1px solid #2b4566!important;border-radius:19px!important;background:linear-gradient(145deg,#101f33,#0d1725)!important;color:#fff!important;text-align:left!important;padding:15px!important;box-shadow:0 8px 22px rgba(0,0,0,.14)!important}
          .quick-action .qa-icon{font-size:27px!important;line-height:30px!important;display:block!important;margin-bottom:7px!important}.quick-action strong{display:block!important;font-size:15px!important}.quick-action span{display:block!important;color:#8292a8!important;font-size:11px!important;margin-top:3px!important}
          .nav{height:108px!important;padding:8px 8px calc(8px + env(safe-area-inset-bottom))!important;gap:4px!important;align-items:center!important;background:rgba(5,10,17,.98)!important;border-top:1px solid #203149!important;z-index:10!important}
          .nav button{font-size:0!important;line-height:1!important;max-width:none!important;padding:6px 2px!important;display:flex!important;flex:1 1 0!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:5px!important;color:#8190a4!important;border:0!important;background:none!important}.nav button .nav-icon{display:block!important;font-size:27px!important;line-height:28px!important;height:29px!important}.nav button .nav-label{display:block!important;font-size:13px!important;line-height:16px!important;font-weight:900!important}.nav .active{color:#fff!important}.plus{width:72px!important;height:72px!important;min-width:72px!important;max-width:72px!important;flex:0 0 72px!important;font-size:35px!important;line-height:1!important;margin-top:-27px!important;border:4px solid #070c14!important;box-shadow:0 10px 30px rgba(21,101,255,.48)!important}
          main{padding-bottom:145px!important}.modal{background:#07101b!important}.modalin{max-width:540px!important}
          .scan-box{position:relative;overflow:hidden;border-radius:24px;background:#050a11;border:1px solid #29415f;min-height:300px;display:grid;place-items:center;margin:15px 0}.scan-box video{width:100%;height:320px;object-fit:cover;display:block}.scan-frame{position:absolute;width:190px;height:190px;border:3px solid #1670ff;border-radius:24px;box-shadow:0 0 0 999px rgba(0,0,0,.18),0 0 28px rgba(22,112,255,.5);pointer-events:none}.scan-status{text-align:center;color:#a9b6c6;font-size:13px;margin:10px 0 14px}
          @media(max-width:380px){main{padding-left:14px!important;padding-right:14px!important}.head-logo{width:100%!important;max-height:108px!important}.nav{height:104px!important;padding-left:5px!important;padding-right:5px!important}.nav button .nav-icon{font-size:24px!important;line-height:25px!important;height:26px!important}.nav button .nav-label{font-size:12px!important;line-height:15px!important}.plus{width:66px!important;height:66px!important;min-width:66px!important;max-width:66px!important}}
          </style>
          '''

          if 'biicode-direct-v5' not in html:
              html = html.replace('</head>', css + '\n</head>', 1)

          old_head = '''<div class="head"><div class="mini">b<b>◯</b></div><div><div class="brand">BIICODE</div><div class="tag" style="text-align:left;margin:2px 0 0">LA TUA BICI. UN'IDENTITÀ UNICA.</div></div></div>'''
          new_head = '''<div class="head"><img class="head-logo" src="./assets/biicode-logo.svg?v=direct5" alt="BIICODE — La tua bici. Un’identità unica."></div>'''
          html = html.replace(old_head, new_head, 1)

          old_shell = '''function shell(active){nav.classList.remove('hidden');nav.innerHTML=`<button class="${active==='home'?'active':''}" onclick="renderHome()">⌂<br>Home</button><button class="${active==='bikes'?'active':''}" onclick="renderBikes()">🚲<br>Bici</button><button class="plus" onclick="addBike()">+</button><button class="${active==='profile'?'active':''}" onclick="profile()">○<br>Profilo</button>`}'''
          new_shell = '''function shell(active){nav.classList.remove('hidden');nav.innerHTML=`<button class="${active==='home'?'active':''}" onclick="renderHome()"><span class="nav-icon">⌂</span><span class="nav-label">Home</span></button><button class="${active==='bikes'?'active':''}" onclick="renderBikes()"><span class="nav-icon">🚲</span><span class="nav-label">Bici</span></button><button class="plus" onclick="addBike()">+</button><button class="${active==='profile'?'active':''}" onclick="profile()"><span class="nav-icon">○</span><span class="nav-label">Profilo</span></button>`}'''
          html = html.replace(old_shell, new_shell, 1)

          quick = '''<div class="quick-actions"><button class="quick-action" type="button" onclick="biicodeScanQR()"><span class="qa-icon">⌾</span><strong>Inquadra QR</strong><span>Verifica una bici</span></button><button class="quick-action" type="button" onclick="biicodeReportTheft()"><span class="qa-icon">🛡️</span><strong>Segnala furto</strong><span>Proteggi la tua bici</span></button></div>'''
          grid = '''<div class="grid"><button class="action" onclick="addBike()"><strong>＋ Immatricola</strong><span class="muted">Registra una bici</span></button><button class="action" onclick="syncFromServer()"><strong>↻ Sincronizza</strong><span class="muted">Aggiorna i dati</span></button></div>'''
          if 'class="quick-actions"' not in html:
              html = html.replace(grid, grid + quick, 1)

          html = html.replace('<div class="logo">b<b>◯</b></div>', '<img class="login-logo" src="./assets/biicode-logo.svg?v=direct5" alt="BIICODE">')

          p.write_text(html, encoding='utf-8')
          print('BIICODE direct UI build complete')
          PY

      - name: Validate generated HTML and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          if 'head-logo' not in html or 'Inquadra QR' not in html or 'Segnala furto' not in html:
              raise SystemExit('BIICODE direct UI markers missing')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          if not scripts:
              raise SystemExit('Inline application script not found')
          Path('/tmp/app.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/app.js
          test -f manifest.json
          test -f sw.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
