name: Repair BIICODE runtime CDN

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply BIICODE source fixes and landing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('biicode-ui-v8.js?v=8','biicode-ui-v8.js?v=10')
          s=s.replace("const V='biicode-v7'","const V='biicode-v11'")
          s=s.replace('auth-fix.js?v=20260916','auth-fix.js?v=20260916-2')
          tag='<script src="./auth-fix.js?v=20260916-2"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          quick='<div class="quick-actions"><button class="quick-action" type="button" onclick="biicodeScanQR()"><span class="qa-icon">⌾</span><strong>Inquadra QR</strong><span>Verifica una bici</span></button><button class="quick-action" type="button" onclick="biicodeReportTheft()"><span class="qa-icon">🛡️</span><strong>Segnala furto</strong><span>Proteggi la tua bici</span></button></div>'
          grid='<div class="grid"><button class="action" onclick="addBike()"><strong>＋ Immatricola</strong><span class="muted">Registra una bici</span></button><button class="action" onclick="syncFromServer()"><strong>↻ Sincronizza</strong><span class="muted">Aggiorna i dati</span></button></div>'
          if quick in s and grid in s:
              s=s.replace(grid+quick,quick+grid)
          marker='biicode-landing-v2'
          if marker not in s:
              landing=r'''<script id="biicode-landing-v2">
          (function(){
            'use strict';
            const main=document.getElementById('main'),nav=document.getElementById('nav');
            if(!main)return;
            const style=document.createElement('style');
            style.id='biicode-landing-style-v2';
            style.textContent=`
              .bio-landing{min-height:100dvh;padding:18px 16px 38px;display:flex;justify-content:center;background:radial-gradient(circle at 50% 0,#15325a 0,#0b1320 38%,#060b12 100%)}
              .bio-land-inner{width:100%;max-width:520px}
              .bio-land-top{text-align:center;padding:8px 0 4px}
              .bio-land-logo{width:min(310px,88%);height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 10px 28px rgba(21,101,255,.14))}
              .bio-land-eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid rgba(77,145,255,.34);border-radius:999px;background:rgba(15,34,58,.72);color:#8fb8ff;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
              .bio-land-hero{margin-top:15px;text-align:center}
              .bio-land-hero h1{font-size:38px!important;line-height:1.02!important;letter-spacing:-.055em!important;margin:0 auto 12px!important;max-width:460px}
              .bio-land-hero h1 span{color:#4f91ff}
              .bio-land-lead{color:#aab9ca;font-size:15px;line-height:1.5;max-width:430px;margin:0 auto}
              .bio-land-cta{display:block;width:100%;min-height:58px;margin:20px 0 9px;border:0;border-radius:17px;background:linear-gradient(135deg,#2584ff,#0758e8);color:#fff;font-size:15px;font-weight:950;letter-spacing:.02em;box-shadow:0 12px 34px rgba(21,101,255,.35);cursor:pointer}
              .bio-land-login{display:block;width:100%;border:0;background:none;color:#8fb8ff;font-size:13px;font-weight:900;padding:9px;cursor:pointer}
              .bio-land-trust{display:flex;justify-content:center;gap:15px;color:#71849a;font-size:10px;margin:9px 0 25px}
              .bio-land-trust span:before{content:'✓';color:#36a0ff;font-weight:900;margin-right:4px}
              .bio-land-section-title{text-align:center;font-size:22px;line-height:1.1;letter-spacing:-.035em;margin:0 0 13px}
              .bio-land-features{display:grid;gap:10px}
              .bio-land-feature{display:flex;gap:13px;align-items:flex-start;padding:16px;border:1px solid #263f5e;border-radius:20px;background:linear-gradient(145deg,rgba(18,35,57,.95),rgba(10,20,33,.96));box-shadow:0 9px 25px rgba(0,0,0,.16)}
              .bio-land-icon{width:43px;height:43px;flex:0 0 43px;border-radius:14px;display:grid;place-items:center;background:#0b1f37;color:#49a0ff;font-size:22px;border:1px solid #245487}
              .bio-land-feature strong{display:block;font-size:15px;margin:1px 0 4px}.bio-land-feature p{margin:0;color:#8596aa;font-size:12px;line-height:1.45}
              .bio-land-how{margin-top:25px;padding:18px;border-radius:22px;border:1px solid #263f5e;background:linear-gradient(145deg,#101f33,#0a1524)}
              .bio-land-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
              .bio-land-step{text-align:center}.bio-land-step b{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 7px;border-radius:50%;background:#1565ff;font-size:14px}.bio-land-step strong{display:block;font-size:11px}.bio-land-step span{display:block;color:#788ba2;font-size:10px;margin-top:3px}
              .bio-land-bottom{margin-top:17px;padding:15px 4px;text-align:center;color:#71849a;font-size:10px;line-height:1.5}
              @media(max-width:380px){.bio-landing{padding:12px 13px 30px}.bio-land-logo{width:275px}.bio-land-hero h1{font-size:33px!important}.bio-land-lead{font-size:14px}.bio-land-cta{margin-top:17px}.bio-land-trust{gap:8px;font-size:9px}.bio-land-feature{padding:14px}.bio-land-how{padding:16px}}
            `;
            document.head.appendChild(style);
            function showLanding(){
              if(localStorage.getItem('biicode_session'))return;
              if(nav)nav.classList.add('hidden');
              main.innerHTML=`<div class="bio-landing"><div class="bio-land-inner">
                <div class="bio-land-top"><img class="bio-land-logo" src="./assets/biicode-logo.svg?v=landing2" alt="BIICODE"><div class="bio-land-eyebrow">IDENTITÀ DIGITALE PER LA TUA BICI</div></div>
                <section class="bio-land-hero"><h1>La tua bici.<br><span>La sua identità.</span></h1><p class="bio-land-lead">Con BIICODE dai alla tua bicicletta un’identità unica, la registri e puoi verificarne lo stato in qualsiasi momento.</p><button class="bio-land-cta" type="button" onclick="window.register()">PROTEGGI LA MIA BICI</button><button class="bio-land-login" type="button" onclick="window.login()">Ho già un account · Accedi</button><div class="bio-land-trust"><span>Registrazione semplice</span><span>Dati personali protetti</span></div></section>
                <section><h2 class="bio-land-section-title">Perché BIICODE?</h2><div class="bio-land-features">
                  <article class="bio-land-feature"><div class="bio-land-icon">◉</div><div><strong>Un’identità unica</strong><p>La tua bici viene associata a un BIICODE e ai suoi dati identificativi.</p></div></article>
                  <article class="bio-land-feature"><div class="bio-land-icon">🛡</div><div><strong>Più tutela, quando serve</strong><p>Se la bici viene rubata, puoi segnalarla e renderne visibile lo stato.</p></div></article>
                  <article class="bio-land-feature"><div class="bio-land-icon">⌾</div><div><strong>Verificabile con un QR</strong><p>Il BIICODE può essere verificato rapidamente per sapere se la bici risulta attiva o segnalata.</p></div></article>
                </div></section>
                <section class="bio-land-how"><h2 class="bio-land-section-title">Inizia in pochi minuti</h2><div class="bio-land-steps"><div class="bio-land-step"><b>1</b><strong>Registrati</strong><span>Crea il tuo account</span></div><div class="bio-land-step"><b>2</b><strong>Immatricola</strong><span>Registra la tua bici</span></div><div class="bio-land-step"><b>3</b><strong>Proteggila</strong><span>Usa il tuo BIICODE</span></div></div></section>
                <div class="bio-land-bottom">Il numero di telaio e i dati personali del proprietario non vengono mostrati nella verifica pubblica.</div>
              </div></div>`;
            }
            showLanding();
          })();
          </script>'''
              s=s.replace('</body>',landing+'\n</body>')
          p.write_text(s,encoding='utf-8')
          print('BIICODE landing v2 applied')
          PY
      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'BIICODE: fix landing login navigation'
          git push
