name: Repair BIICODE runtime CDN

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump BIICODE runtime cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const V='biicode-v10'", "const V='biicode-v11'")
          s=s.replace('auth-fix.js?v=20260916-2', 'auth-fix.js?v=20260916-3')
          tag='<script src="./auth-fix.js?v=20260916-3"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'BIICODE: bump final runtime cache'
          git push
