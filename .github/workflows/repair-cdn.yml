name: Verify BIICODE runtime

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify single welcome controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          n=s.count('src="./auth-fix.js')
          if n != 1:
              raise SystemExit(f'Expected exactly one auth-fix.js include, found {n}')
          if 'biicode-landing-v1' in s or 'biicode-landing-v2' in s:
              raise SystemExit('Legacy landing code still present')
          print('BIICODE runtime OK: one welcome controller')
          PY
