<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1320">
<title>BIICODE · Reimposta password</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1320;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:100%;max-width:410px;background:#111d2d;border:1px solid #203149;border-radius:20px;padding:24px}.logo{text-align:center;font-size:38px;font-weight:950}.logo b{color:#1565ff}.tag{text-align:center;color:#94a1b3;font-size:10px;letter-spacing:1.4px;margin:4px 0 25px}.title{font-size:25px;font-weight:900;margin-bottom:6px}.muted{color:#94a1b3;font-size:13px;line-height:1.5}label{display:block;margin:18px 0 7px;color:#aab5c4;font-size:13px;font-weight:700}input{width:100%;min-height:54px;padding:13px 14px;background:#0b1625;border:1px solid #2a3b52;border-radius:13px;color:#fff;outline:0}input:focus{border-color:#1565ff}.btn{width:100%;min-height:54px;border:0;border-radius:13px;font-weight:900;margin-top:16px;background:#1565ff;color:#fff}.btn:disabled{opacity:.55}.msg{padding:12px;border-radius:12px;margin:0 0 14px;font-size:13px;line-height:1.4}.error{background:#29151b;color:#ffb4bc}.ok{background:#10271c;color:#a9efc4}.hidden{display:none}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}a{color:#5790ff;font-weight:800;text-decoration:none;display:block;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">b<b>◯</b></div>
  <div class="tag">BIICODE · SICUREZZA ACCOUNT</div>
  <div id="msg" class="msg hidden"></div>
  <div id="form">
    <div class="title">Nuova password</div>
    <div class="muted">Inserisci una nuova password per il tuo account BIICODE.</div>
    <label for="password">Nuova password</label>
    <input id="password" type="password" autocomplete="new-password" minlength="6">
    <label for="confirm">Conferma password</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="6">
    <button id="save" class="btn" onclick="resetPassword()">SALVA NUOVA PASSWORD</button>
  </div>
  <a id="back" href="./index.html">← Torna a BIICODE</a>
</div>
<script>
const SUPABASE_URL='https://swzkrwdqfgetwcmaiqty.supabase.co';
const SUPABASE_KEY='sb_publishable_inpwNp-Uqe-X4BeTl54uiQ_1ARA1HNb';
const msgEl=document.getElementById('msg'), form=document.getElementById('form'), save=document.getElementById('save');
function show(text,type='error'){msgEl.textContent=text;msgEl.className='msg '+type;}
function hide(){msgEl.className='msg hidden';}
function tokens(){
  const hash=new URLSearchParams(location.hash.replace(/^#/,'')).entries();
  return Object.fromEntries(hash);
}
async function resetPassword(){
  hide();
  const p=document.getElementById('password').value;
  const c=document.getElementById('confirm').value;
  const t=tokens();
  if(!t.access_token)return show('Il link di recupero non è valido o è scaduto. Richiedi nuovamente il recupero password.');
  if(p.length<6)return show('La password deve contenere almeno 6 caratteri.');
  if(p!==c)return show('Le due password non coincidono.');
  save.disabled=true;save.innerHTML='<span class="spinner"></span> SALVATAGGIO...';
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+t.access_token,'Content-Type':'application/json'},body:JSON.stringify({password:p})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.msg||d.message||d.error_description||'Impossibile aggiornare la password.');
    show('Password aggiornata correttamente. Ora puoi accedere a BIICODE con la nuova password.','ok');
    form.innerHTML='<div class="title">Password aggiornata</div><div class="muted">La nuova password è stata salvata. Tocca il pulsante qui sotto per tornare al login.</div><button class="btn" onclick="location.href=\'./index.html\'">VAI AL LOGIN</button>';
    history.replaceState(null,'',location.pathname);
  }catch(e){show(e.message||'Impossibile aggiornare la password.');save.disabled=false;save.textContent='SALVA NUOVA PASSWORD';}
}
(function(){
  const t=tokens();
  if(t.error_description||t.error){show(decodeURIComponent(t.error_description||t.error||'Il link di recupero non è valido.'));form.classList.add('hidden');}
  else if(!t.access_token){show('Apri questa pagina dal link ricevuto via email per reimpostare la password.');}
})();
</script>
</body>
</html>
